<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f1f5f9;
}

/* HEADER */
.header{
    background:#0d6efd;
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

/* CONTAINER */
.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:85vh;
}

/* CONTACT BOX */
.contact-box{
    background:white;
    width:400px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    text-align:center;
}

/* TITLE */
.contact-box h2{
    color:#0d6efd;
    margin-bottom:10px;
}

.contact-box p{
    color:#555;
    margin-bottom:25px;
}

/* INFO BOX */
.info{
    background:#f8fafc;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
    font-size:17px;
}

/* BUTTON */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#0d6efd;
    color:white;
    text-decoration:none;
    border-radius:8px;
    transition:0.3s;
}

.btn:hover{
    background:#0b5ed7;
}

/* FOOTER */
.footer{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:12px;
    position:fixed;
    bottom:0;
    width:100%;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">Prime Software</div>
    <a href="dashboard.html"><button>log out</button></a>

</div>

<!-- CONTACT -->
<div class="container">

<div class="contact-box">

    <h2>📞 Contact Us</h2>

    <p>If you have any problem or support issue contact us.</p>

    <div class="info">
        📧 Email: primewebtech5@gmail.com

    </div>

    <div class="info">
        🌐 Company: Prime Web Tech
    </div>


</div>

</div>

<!-- FOOTER -->
<div class="footer">
    Made By PrimeWebTech © 2022 - 2026
</div>

</body>
</html>
