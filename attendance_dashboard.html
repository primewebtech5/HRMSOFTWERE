<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime E.M.S — Attendance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --ink:#0c1220;
    --panel:#121a2b;
    --panel-2:#182338;
    --hair:#25314a;
    --steel:#8592ab;
    --amber:#f2a93b;
    --amber-deep:#c9821f;
    --danger:#e2534d;
    --success:#3ecf7a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--ink);
    color:#e7ecf6;
    min-height:100vh;
    overflow-x:hidden;
}

button, a{
    font-family:inherit;
}

/* ============ HAMBURGER ============ */

.hamburger{
    width:38px;
    height:38px;
    background:transparent;
    border:1px solid var(--hair);
    border-radius:7px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    flex-shrink:0;
    transition:border-color 0.2s ease;
}

.hamburger:hover{
    border-color:var(--amber);
}

.hamburger span{
    width:16px;
    height:2px;
    background:#e7ecf6;
    border-radius:1px;
    transition:transform 0.25s ease, opacity 0.2s ease;
}

.hamburger.open span:nth-child(1){ transform:translateY(6px) rotate(45deg); }
.hamburger.open span:nth-child(2){ opacity:0; }
.hamburger.open span:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }

/* ============ HEADER ============ */

.top-bar{
    background:var(--panel);
    border-bottom:1px solid var(--hair);
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:20;
}

.top-bar .title{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:1px;
}

.top-bar .title span{
    color:var(--amber);
}

.top-actions{
    display:flex;
    align-items:center;
    gap:14px;
    margin-left:auto;
}

.back-link{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    color:var(--steel);
    text-decoration:none;
    border:1px solid var(--hair);
    padding:8px 14px;
    border-radius:6px;
    transition:border-color 0.2s ease, color 0.2s ease;
}

.back-link:hover{
    border-color:var(--amber);
    color:var(--amber);
}

.refresh-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    background:linear-gradient(135deg,var(--amber),var(--amber-deep));
    border:none;
    color:#1a1200;
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    font-weight:700;
    text-transform:uppercase;
}

.live-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:#6fe08a;
    letter-spacing:1px;
}

.live-tag::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:#6fe08a;
    animation:pulse-dot 1.8s ease-out infinite;
}

@keyframes pulse-dot{
    0%{ box-shadow:0 0 0 0 rgba(111,224,138,0.55); }
    70%{ box-shadow:0 0 0 7px rgba(111,224,138,0); }
    100%{ box-shadow:0 0 0 0 rgba(111,224,138,0); }
}

/* ============ SIDEBAR ============ */

.sidebar-overlay{
    position:fixed;
    inset:0;
    background:rgba(4,7,14,0.6);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:29;
}

.sidebar-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.sidebar{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:260px;
    background:var(--panel);
    border-right:1px solid var(--hair);
    transform:translateX(-100%);
    transition:transform 0.28s cubic-bezier(.2,.7,.3,1);
    z-index:30;
    display:flex;
    flex-direction:column;
    padding:20px 0;
}

.sidebar.active{
    transform:translateX(0);
}

.sidebar-brand{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:3px;
    padding:0 22px 22px;
    border-bottom:1px solid var(--hair);
    margin-bottom:12px;
}

.sidebar-brand span{
    color:var(--amber);
}

.sidebar-label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--steel);
    padding:8px 22px;
}

.side-item{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    background:none;
    border:none;
    color:#c8d0e0;
    text-decoration:none;
    padding:12px 22px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    text-align:left;
    border-left:3px solid transparent;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.side-item .ic{
    font-size:16px;
    width:20px;
    text-align:center;
}

.side-item:hover{
    background:var(--panel-2);
    color:#e7ecf6;
}

.side-item.active{
    background:var(--panel-2);
    color:var(--amber);
    border-left-color:var(--amber);
}

.sidebar-footer{
    margin-top:auto;
    padding:14px 22px;
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    color:var(--steel);
    letter-spacing:1px;
    border-top:1px solid var(--hair);
}

/* ============ CONTENT ============ */

.content{
    padding:22px;
    max-width:1100px;
    margin:0 auto;
}

.view{
    display:none;
}

.view.active{
    display:block;
}

.view-heading{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:700;
    margin-bottom:4px;
}

.view-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--steel);
    letter-spacing:1px;
    margin-bottom:20px;
}

.state-msg{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--steel);
    padding:60px 20px;
}

.state-msg.error{
    color:var(--danger);
}

/* ---- report grid ---- */

.punch-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:16px;
}

.punch-card{
    background:var(--panel);
    border:1px solid var(--hair);
    border-radius:10px;
    overflow:hidden;
    transition:border-color 0.2s ease, transform 0.2s ease;
}

.punch-card:hover{
    border-color:var(--amber-deep);
    transform:translateY(-2px);
}

.punch-card .photo{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    background:var(--panel-2);
    display:block;
    cursor:pointer;
}

.punch-card .body{
    padding:12px 14px;
}

.punch-card .name{
    font-family:'Space Grotesk',sans-serif;
    font-size:14.5px;
    font-weight:700;
    margin-bottom:2px;
}

.punch-card .id{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--amber);
    letter-spacing:1px;
    margin-bottom:8px;
}

.punch-card .meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--steel);
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
}

.punch-card a.map-link{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--steel);
    text-decoration:none;
    border-top:1px dashed var(--hair);
    padding-top:8px;
    margin-top:2px;
    width:100%;
    transition:color 0.2s ease;
}

.punch-card a.map-link:hover{
    color:var(--amber);
}

/* ---- gallery grid ---- */

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px;
}

.gallery-item{
    position:relative;
    aspect-ratio:1/1;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid var(--hair);
}

.gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.3s ease;
}

.gallery-item:hover img{
    transform:scale(1.08);
}

.gallery-item .tag{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    background:linear-gradient(0deg,rgba(0,0,0,0.75),transparent);
    color:#fff;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    padding:14px 8px 6px;
    letter-spacing:0.5px;
}

/* ---- lightbox ---- */

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(4,7,14,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:24px;
}

.lightbox.active{
    display:flex;
}

.lightbox img{
    max-width:min(500px,90vw);
    max-height:80vh;
    border-radius:12px;
    border:2px solid var(--hair);
}

.lightbox-close{
    position:absolute;
    top:20px;
    right:24px;
    background:none;
    border:none;
    color:#e7ecf6;
    font-size:28px;
    cursor:pointer;
    line-height:1;
}

.lightbox-caption{
    position:absolute;
    bottom:30px;
    left:0;
    right:0;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--steel);
}

.lightbox-caption b{
    color:var(--amber);
}

@media (prefers-reduced-motion: reduce){
    .sidebar, .sidebar-overlay, .hamburger span, .gallery-item img{
        transition:none;
    }
}

</style>
</head>

<body>

<div class="top-bar">
    <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="title">Prime <span>Attendance</span></div>
    <div class="top-actions">
        <span class="live-tag">AUTO-REFRESH</span>
        <button class="refresh-btn" onclick="loadPunches()">Refresh</button>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">PRIME <span>E.M.S</span></div>

    <div class="sidebar-label">Attendance</div>
    <button class="side-item active" data-view="view-report" onclick="switchView('view-report', this)">
        <span class="ic">📋</span> Employee Punch-In Report
    </button>
    <button class="side-item" data-view="view-gallery" onclick="switchView('view-gallery', this)">
        <span class="ic">🖼️</span> Images
    </button>

    <div class="sidebar-label">Navigate</div>
    <a class="side-item" href="dashboard.html">
        <span class="ic">🏠</span> Main Dashboard
    </a>

    <div class="sidebar-footer">Prime E.M.S · 1.0.0(a)</div>
</div>

<div class="content">

    <div class="view active" id="view-report">
        <div class="view-heading">Employee Punch-In Report</div>
        <div class="view-sub" id="reportSub">Loading punch entries...</div>
        <div id="reportGrid" class="punch-grid"></div>
    </div>

    <div class="view" id="view-gallery">
        <div class="view-heading">Selfie Images</div>
        <div class="view-sub" id="gallerySub">Loading images...</div>
        <div id="galleryGrid" class="gallery-grid"></div>
    </div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <img id="lightboxImg" src="" alt="Selfie preview">
    <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>

/* ======= SET THIS TO THE SAME GOOGLE APPS SCRIPT WEB APP URL USED IN punch.html ======= */
const API_URL = "https://script.google.com/macros/s/AKfycbyFQFl8Mf68sdWJzMvAh4pNT4jmHAbsy-K8PrTvyAaEzTSXmj-W26W_qZRqWtuTbwRP6A/exec";
/* ======================================================================================== */

let latestData = [];

/* ---------------- SIDEBAR ---------------- */

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("sidebarOverlay").classList.toggle("active");
    document.getElementById("hamburgerBtn").classList.toggle("open");
}

function switchView(viewId, btn){
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById(viewId).classList.add("active");

    document.querySelectorAll(".side-item[data-view]").forEach(i => i.classList.remove("active"));
    if(btn) btn.classList.add("active");

    toggleSidebar();
}

/* ---------------- DATA LOAD ---------------- */

async function loadPunches(){
    const reportSub = document.getElementById("reportSub");
    const gallerySub = document.getElementById("gallerySub");
    const reportGrid = document.getElementById("reportGrid");
    const galleryGrid = document.getElementById("galleryGrid");

    if(API_URL.indexOf("PASTE_YOUR") === 0){
        reportSub.textContent = "Backend URL not set yet.";
        reportSub.className = "view-sub error";
        return;
    }

    try{
        const res = await fetch(API_URL + "?action=list");
        const data = await res.json();

        if(!Array.isArray(data) || data.length === 0){
            reportSub.textContent = "No punch entries yet.";
            gallerySub.textContent = "No images yet.";
            reportGrid.innerHTML = "";
            galleryGrid.innerHTML = "";
            return;
        }

        latestData = data;
        reportSub.textContent = `${data.length} punch entr${data.length === 1 ? "y" : "ies"} recorded`;
        gallerySub.textContent = `${data.length} selfie${data.length === 1 ? "" : "s"} captured`;

        renderReport(data);
        renderGallery(data);

    } catch(err){
        reportSub.textContent = "Could not load data. Check the backend URL and try again.";
        reportSub.className = "view-sub error";
    }
}

function renderReport(data){
    const reportGrid = document.getElementById("reportGrid");

    reportGrid.innerHTML = data.map((entry, i) => `
        <div class="punch-card">
            <img class="photo" src="${entry.photoUrl}" alt="Selfie of ${escapeHtml(entry.name)}" loading="lazy" onclick="openLightbox(${i})">
            <div class="body">
                <div class="name">${escapeHtml(entry.name)}</div>
                <div class="id">${escapeHtml(entry.employeeId)}</div>
                <div class="meta">
                    <span>${escapeHtml(entry.date)}</span>
                    <span>${escapeHtml(entry.time)}</span>
                </div>
                <a class="map-link" href="${entry.mapsLink}" target="_blank" rel="noopener">📍 View punch location</a>
            </div>
        </div>
    `).join("");
}

function renderGallery(data){
    const galleryGrid = document.getElementById("galleryGrid");

    galleryGrid.innerHTML = data.map((entry, i) => `
        <div class="gallery-item" onclick="openLightbox(${i})">
            <img src="${entry.photoUrl}" alt="Selfie of ${escapeHtml(entry.name)}" loading="lazy">
            <div class="tag">${escapeHtml(entry.name)} · ${escapeHtml(entry.time)}</div>
        </div>
    `).join("");
}

/* ---------------- LIGHTBOX ---------------- */

function openLightbox(index){
    const entry = latestData[index];
    if(!entry) return;

    document.getElementById("lightboxImg").src = entry.photoUrl;
    document.getElementById("lightboxCaption").innerHTML =
        `<b>${escapeHtml(entry.name)}</b> (${escapeHtml(entry.employeeId)}) — ${escapeHtml(entry.date)} ${escapeHtml(entry.time)}`;
    document.getElementById("lightbox").classList.add("active");
}

function closeLightbox(e){
    if(e.target.id === "lightbox" || e.target.classList.contains("lightbox-close")){
        document.getElementById("lightbox").classList.remove("active");
    }
}

function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
}

loadPunches();
setInterval(loadPunches, 30000);

</script>

</body>
</html>
