<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Secure Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:linear-gradient(
    135deg,
    #0d6efd,
    #1e293b
    );

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    padding:20px;
}

/* LOGIN BOX */

.box{

    background:white;

    padding:35px;

    border-radius:18px;

    width:100%;

    max-width:380px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.3);

    text-align:center;

    animation:fade 0.5s ease;
}

/* TITLE */

h2{

    margin-bottom:25px;

    color:#0d6efd;

    font-size:32px;
}

/* INPUT AREA */

.input-box{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
}

/* INPUT */

input{

    width:100%;

    padding:14px;

    margin:12px 0;

    border-radius:10px;

    border:1px solid #ccc;

    outline:none;

    transition:0.3s;

    font-size:15px;
}

input:focus{

    border-color:#0d6efd;

    box-shadow:
    0 0 8px #0d6efd;
}

/* BUTTON */

button{

    width:100%;

    padding:14px;

    background:#0d6efd;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:17px;

    margin-top:15px;

    transition:0.3s;
}

button:hover{

    background:#0b5ed7;

    transform:scale(1.02);
}

/* LINK */

.link{

    margin-top:18px;
}

.link a{

    text-decoration:none;

    color:#0d6efd;

    font-weight:bold;

    font-size:16px;
}

.link a:hover{

    text-decoration:underline;
}

/* ERROR */

#error{

    color:red;

    margin-top:10px;

    font-size:14px;
}

/* SUCCESS */

#success{

    color:green;

    margin-top:10px;

    font-size:14px;
}

/* MOBILE RESPONSIVE */

@media(max-width:500px){

    .box{

        padding:25px 20px;

        border-radius:15px;
    }

    h2{

        font-size:26px;
    }

    input{

        font-size:14px;

        padding:12px;
    }

    button{

        font-size:15px;

        padding:12px;
    }

    .link a{

        font-size:15px;
    }
}

/* ANIMATION */

@keyframes fade{

    from{

        opacity:0;

        transform:translateY(20px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

</style>
</head>

<body oncontextmenu="return false">

<div class="box">

<h2>🔐 Secure Login</h2>

<div class="input-box">

<input
type="text"
id="username"
placeholder="Username"
autocomplete="off">

<input
type="password"
id="password"
placeholder="Password"
autocomplete="new-password">

<button onclick="login()">
Login
</button>

<div id="error"></div>

<div id="success"></div>

</div>

<div class="link">

<a href="signup.html">

Create Account

</a>

</div>

</div>

<script>

/* GOOGLE SHEET WEB APP URL */

const API_URL =
"https://script.google.com/macros/s/AKfycbye7Y5dbCH3M8Ep2NvDCk1P2AJ3natbDzpQ_U9oG0WZR-AX7aNxYedCTWYIsyK3Yb9i/exec";

/* LOGIN FUNCTION */

async function login(){

    let user =
    document
    .getElementById("username")
    .value
    .trim();

    let pass =
    document
    .getElementById("password")
    .value
    .trim();

    let error =
    document
    .getElementById("error");

    let success =
    document
    .getElementById("success");

    error.innerText = "";

    success.innerText = "";

    /* VALIDATION */

    if(user === "" || pass === ""){

        error.innerText =
        "Please fill all fields";

        return;
    }

    try{

        /* FETCH DATA */

        let response =
        await fetch(API_URL);

        let data =
        await response.json();

        console.log(data);

        /* CHECK USER */

        let found =
        data.find(d =>

            d.username == user &&

            d.password == pass
        );

        if(found){

            success.innerText =
            "Login Success ✅";

            localStorage.setItem(
                "loginUser",
                user
            );

            setTimeout(()=>{

                window.location.href =
                "dashboard.html";

            },1000);

        }else{

            error.innerText =
            "Wrong Username or Password ❌";
        }

    }catch(err){

        console.log(err);

        error.innerText =
        "Server Error ❌";
    }
}

/* ENTER KEY LOGIN */

document
.getElementById("password")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){

        login();
    }
});

/* 🚫 DISABLE COPY */

document.addEventListener(
"copy",
e => e.preventDefault()
);

/* 🚫 DISABLE PASTE */

document.addEventListener(
"paste",
e => e.preventDefault()
);

/* 🚫 DISABLE CUT */

document.addEventListener(
"cut",
e => e.preventDefault()
);

/* 🚫 DISABLE RIGHT CLICK */

document.addEventListener(
"contextmenu",
e => e.preventDefault()
);

/* 🚫 DISABLE DEVTOOLS */

document.onkeydown = function(e){

    if(e.keyCode == 123)
    return false;

    if(
        e.ctrlKey &&
        e.shiftKey &&
        e.keyCode == 73
    )
    return false;

    if(
        e.ctrlKey &&
        e.shiftKey &&
        e.keyCode == 74
    )
    return false;

    if(
        e.ctrlKey &&
        e.keyCode == 85
    )
    return false;
}

/* 🚫 DISABLE DRAG */

document.addEventListener(
"dragstart",
e => e.preventDefault()
);

</script>

</body>
</html>
