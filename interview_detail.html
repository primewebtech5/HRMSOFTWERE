<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Manager</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

/* HEADER */
.header{
    background:#0d6efd;
    color:white;
    padding:15px 20px;
}

.header-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.exit-btn{
    background:white;
    color:#0d6efd;
    padding:8px 15px;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

/* NAV */
.nav{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:15px;
    flex-wrap:wrap;
}

.nav button{
    padding:10px 20px;
    flex:1;
    min-width:140px;
}

/* PAGE */
.page{ display:none; }
.active{ display:block; }

/* FORM */
.form-box{
    background:white;
    padding:20px;
    margin:15px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* INPUT */
input, textarea, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

/* BUTTON */
button{
    background:#0d6efd;
    color:white;
    border:none;
    cursor:pointer;
    padding:10px 15px;
    border-radius:6px;
}

button:hover{ background:#0b5ed7; }

/* SEARCH */
.search-box{
    margin:15px;
    text-align:center;
}

.search-box input{
    width:60%;
    max-width:500px;
    min-width:200px;
}

/* CONTAINER */
.container{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    padding:15px;
    justify-content:center;
}

/* CARD */
.card{
    background:white;
    width:260px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
    flex:1 1 260px;
    max-width:320px;
}

/* IMAGE */
.card img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:5px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal img{
    max-width:90%;
    max-height:90%;
    border-radius:10px;
}

/* RESPONSIVE */
@media (max-width:768px){

    .header-box{
        flex-direction:column;
        align-items:flex-start;
    }

    .search-box input{
        width:95%;
    }

    .nav button{
        width:100%;
    }

    .card{
        width:100%;
        max-width:100%;
    }
}

</style>
</head>

<body>

<div class="header">
    <div class="header-box">
        <div style="font-size:20px;font-weight:bold;">
            Candidate Management System
        </div>

        <a href="dashboard.html">
            <button class="exit-btn">Exit</button>
        </a>
    </div>
</div>

<div class="nav">
    <button onclick="showPage('add')">Add Candidate</button>
    <button onclick="showPage('view')">View Candidates</button>
</div>

<!-- ADD -->
<div id="add" class="page active">
<div class="form-box">

<input type="text" id="sr" placeholder="SR Number">
<input type="text" id="name" placeholder="Candidate Name">
<input type="text" id="email" placeholder="Email">
<input type="text" id="mobile" placeholder="Mobile Number">
<textarea id="skills" placeholder="Remarks"></textarea>
<input type="date" id="date">

<select id="selected">
<option value="">Selected?</option>
<option value="Yes">Yes</option>
<option value="No">No</option>
</select>

<input type="file" id="image1" accept="image/*">
<input type="file" id="image2" accept="image/*">

<button onclick="saveData()">Save Candidate</button>

</div>
</div>

<!-- VIEW -->
<div id="view" class="page">

<div class="search-box">
<input type="text" id="search" placeholder="Search..." onkeyup="searchData()">
<br><br>
<button onclick="exportExcel()">Export Excel</button>
<button onclick="downloadPDF()">Download PDF</button>
</div>

<div class="container" id="list"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeImage()">
<img id="modalImg">
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyVryWmLsn91_JI5DraZGuXU-pTSljPTDVh8pEadULKGF-jfIv_ztGEfuSx6nxNGiA/exec";

let candidates = [];
let filtered = [];

function showPage(page){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(page).classList.add("active");
    if(page==="view") loadCandidates();
}

async function loadCandidates(){
try{
    let res = await fetch(API_URL);
    let sheetData = await res.json();

    let localData = JSON.parse(localStorage.getItem("candidates")) || [];

    candidates = sheetData.map(s=>{
        let local = localData.find(l=>l.sr===s.sr);
        return {
            ...s,
            image1: local?local.image1:"",
            image2: local?local.image2:""
        };
    });

    filtered=[...candidates];
    display(filtered);

}catch(e){
    alert("Data Load Error");
}
}

function display(data){
let list=document.getElementById("list");
list.innerHTML="";

if(data.length===0){
list.innerHTML="<h3>No Candidate Found</h3>";
return;
}

data.forEach(c=>{
list.innerHTML+=`
<div class="card">
<img src="${c.image1}" onclick="showImage('${c.image1}')">
<img src="${c.image2}" onclick="showImage('${c.image2}')">
<h3>${c.name}</h3>
<p><b>SR:</b> ${c.sr}</p>
<p><b>Email:</b> ${c.email}</p>
<p><b>Mobile:</b> ${c.mobile}</p>
<p><b>Remarks:</b> ${c.skills}</p>
<p><b>Date:</b> ${c.date}</p>
<p><b>Selected:</b> ${c.selected}</p>
</div>`;
});
}

function searchData(){
let val=document.getElementById("search").value.toLowerCase();
filtered=candidates.filter(c=>(c.name||"").toLowerCase().includes(val));
display(filtered);
}

function saveData(){

let sr=document.getElementById("sr").value;
let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let mobile=document.getElementById("mobile").value;
let skills=document.getElementById("skills").value;
let date=document.getElementById("date").value;
let selected=document.getElementById("selected").value;

let f1=document.getElementById("image1").files[0];
let f2=document.getElementById("image2").files[0];

if(!sr||!name||!email||!mobile){
alert("Fill all fields");
return;
}

if(!f1||!f2){
alert("2 images required");
return;
}

let r1=new FileReader();
let r2=new FileReader();

r1.onload=function(){
r2.onload=async function(){

let candidate={
sr,name,email,mobile,skills,date,selected,
image1:r1.result,
image2:r2.result
};

let local=JSON.parse(localStorage.getItem("candidates"))||[];
local=local.filter(c=>c.sr!==sr);
local.push(candidate);
localStorage.setItem("candidates",JSON.stringify(local));

await fetch(API_URL,{
method:"POST",
body:JSON.stringify(candidate)
});

alert("Saved");
clearForm();
loadCandidates();
};

r2.readAsDataURL(f2);
};

r1.readAsDataURL(f1);
}

function clearForm(){
document.querySelectorAll("input,textarea,select").forEach(e=>e.value="");
}

function showImage(src){
document.getElementById("modal").style.display="flex";
document.getElementById("modalImg").src=src;
}

function closeImage(){
document.getElementById("modal").style.display="none";
}

function exportExcel(){
let csv="SR,Name,Email,Mobile,Remarks,Date,Selected\n";
candidates.forEach(c=>{
csv+=`${c.sr},${c.name},${c.email},${c.mobile},${c.skills},${c.date},${c.selected}\n`;
});

let blob=new Blob([csv],{type:"text/csv"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="candidates.csv";
a.click();
}

async function downloadPDF(){
const {jsPDF}=window.jspdf;
let doc=new jsPDF();
let y=20;

doc.text("Candidate Report",60,10);

candidates.forEach(c=>{
doc.text(`SR:${c.sr}`,10,y);
doc.text(`Name:${c.name}`,10,y+6);
doc.text(`Mobile:${c.mobile}`,100,y+6);
y+=20;
if(y>270){doc.addPage();y=20;}
});

doc.save("report.pdf");
}

loadCandidates();

</script>

</body>
</html>
