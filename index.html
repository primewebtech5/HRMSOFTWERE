<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Software</title>
<style>
 
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
 
/* BODY — deep black base */
body{
    font-family:Arial;
    background:#000000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    color:white;
    position:relative;
}
 
/* SUBTLE ANIMATED TECH GRID OVERLAY */
.grid-overlay{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(56,189,248,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,0.06) 1px, transparent 1px);
    background-size:42px 42px;
    animation:gridDrift 12s linear infinite;
    z-index:0;
}
 
@keyframes gridDrift{
    0%{ background-position:0 0, 0 0; }
    100%{ background-position:42px 42px, 42px 42px; }
}
 
/* SCANLINE SWEEP — a soft horizontal light band drifting down the
   whole screen, hologram/tech-boot feel */
.scanline{
    position:absolute;
    left:0;
    width:100%;
    height:140px;
    background:linear-gradient(
        to bottom,
        rgba(56,189,248,0) 0%,
        rgba(56,189,248,0.09) 50%,
        rgba(56,189,248,0) 100%
    );
    z-index:1;
    animation:scanMove 3.6s linear infinite;
    mix-blend-mode:screen;
    pointer-events:none;
}
 
@keyframes scanMove{
    0%{ top:-140px; }
    100%{ top:100%; }
}
 
/* DRIFTING GLOW BLOBS (blue/cyan light against the black) */
.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
    opacity:0.55;
}
 
.glow-1{
    width:420px;
    height:420px;
    background:#1e3a8a;
    top:-120px;
    left:-100px;
    animation:driftA 9s ease-in-out infinite;
}
 
.glow-2{
    width:380px;
    height:380px;
    background:#0284c7;
    bottom:-140px;
    right:-100px;
    animation:driftB 11s ease-in-out infinite;
}
 
.glow-3{
    width:260px;
    height:260px;
    background:#38bdf8;
    top:40%;
    left:60%;
    animation:driftC 7s ease-in-out infinite;
    opacity:0.35;
}
 
@keyframes driftA{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(60px,40px) scale(1.15); }
}
 
@keyframes driftB{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-50px,-30px) scale(1.1); }
}
 
@keyframes driftC{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-40px,30px) scale(1.2); }
}
 
/* FLOATING PARTICLES — small glowing dots drifting upward */
.particle{
    position:absolute;
    bottom:-20px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#38bdf8;
    box-shadow:0 0 8px 2px rgba(56,189,248,0.8);
    z-index:1;
    opacity:0;
    animation:particleUp linear infinite;
}
 
@keyframes particleUp{
    0%{
        transform:translateY(0) scale(1);
        opacity:0;
    }
    10%{
        opacity:0.9;
    }
    90%{
        opacity:0.4;
    }
    100%{
        transform:translateY(-100vh) scale(0.4);
        opacity:0;
    }
}
 
/* CENTER BOX */
.box{
    position:relative;
    z-index:2;
    text-align:center;
    animation:floatBox 4s ease-in-out infinite;
}
 
/* LOGO BADGE */
.badge{
    width:74px;
    height:74px;
    margin:0 auto 22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:rgba(56,189,248,0.08);
    border:1px solid rgba(56,189,248,0.4);
    box-shadow:
        0 0 20px rgba(56,189,248,0.5),
        0 0 45px rgba(2,132,199,0.3),
        inset 0 0 15px rgba(56,189,248,0.1);
    opacity:0;
    transform:scale(0.5);
    animation:badgeIn 0.6s cubic-bezier(0.2,0.8,0.3,1) forwards,
              badgePulse 2.2s ease-in-out 0.6s infinite;
}
 
@keyframes badgeIn{
    to{
        opacity:1;
        transform:scale(1);
    }
}
 
@keyframes badgePulse{
    0%,100%{
        box-shadow:
            0 0 20px rgba(56,189,248,0.5),
            0 0 45px rgba(2,132,199,0.3),
            inset 0 0 15px rgba(56,189,248,0.1);
    }
    50%{
        box-shadow:
            0 0 28px rgba(56,189,248,0.75),
            0 0 60px rgba(2,132,199,0.45),
            inset 0 0 20px rgba(56,189,248,0.18);
    }
}
 
/* MAIN TITLE (glass card holding the animated letters) */
.title{
    font-size:40px;
    font-weight:bold;
    background:rgba(255,255,255,0.06);
    padding:15px 30px;
    border-radius:20px;
    backdrop-filter:blur(12px);
    border:1px solid rgba(56,189,248,0.35);
    box-shadow:
    0 0 25px rgba(56,189,248,0.45),
    0 0 55px rgba(2,132,199,0.25),
    inset 0 0 20px rgba(56,189,248,0.05);
    white-space:nowrap;
}
 
/* Each letter starts hidden, animated in one by one via JS-assigned
   animation-delay (typewriter-style reveal) */
.title .char{
    display:inline-block;
    opacity:0;
    transform:translateY(16px) scale(0.7);
    animation:letterIn 0.45s cubic-bezier(0.2,0.8,0.3,1) forwards;
    text-shadow:0 0 12px rgba(56,189,248,0.6);
}
 
/* Blinking cursor shown right after the last letter while typing */
.cursor{
    display:inline-block;
    width:3px;
    margin-left:4px;
    background:#38bdf8;
    box-shadow:0 0 8px #38bdf8;
    animation:blink 0.7s step-end infinite;
    opacity:0;
}
 
.cursor.show{
    opacity:1;
}
 
/* SUBTITLE — hidden until the title finishes typing */
.subtitle{
    margin-top:16px;
    font-size:15px;
    letter-spacing:2px;
    opacity:0;
    transform:translateY(8px);
    color:#94a3b8;
}
 
.subtitle.show{
    animation:fadeText 0.7s ease forwards;
}
 
/* LOADING BAR — synced to the 3-second total timing */
.loader-track{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:3px;
    background:rgba(255,255,255,0.06);
    z-index:3;
}
 
.loader-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#1e3a8a,#38bdf8);
    box-shadow:0 0 10px rgba(56,189,248,0.8);
    animation:loadFill 3s linear forwards;
}
 
@keyframes loadFill{
    to{ width:100%; }
}
 
/* LETTER REVEAL */
@keyframes letterIn{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}
 
/* CURSOR BLINK */
@keyframes blink{
    50%{ opacity:0; }
}
 
/* FLOAT EFFECT */
@keyframes floatBox{
    0%{ transform:translateY(0px); }
    50%{ transform:translateY(-10px); }
    100%{ transform:translateY(0px); }
}
 
/* SUBTEXT FADE */
@keyframes fadeText{
    from{
        opacity:0;
        letter-spacing:8px;
        transform:translateY(8px);
    }
    to{
        opacity:0.9;
        letter-spacing:2px;
        transform:translateY(0);
    }
}
 
/* MOBILE */
@media(max-width:600px){
    .title{
        font-size:26px;
        padding:12px 20px;
    }
    .subtitle{
        font-size:12px;
    }
    .glow-1, .glow-2{
        width:280px;
        height:280px;
    }
    .badge{
        width:60px;
        height:60px;
        font-size:28px;
    }
}
 
</style>
</head>
<body>
 
<div class="grid-overlay"></div>
<div class="scanline"></div>
 
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>
 
<div id="particles"></div>
 
<div class="box">
 
    <div class="badge">👔</div>
 
    <div class="title" id="title"></div>
 
    <div class="subtitle" id="subtitle">Made by PrimeWebTech</div>
 
</div>
 
<div class="loader-track">
    <div class="loader-fill"></div>
</div>
 
<script>
 
/* ============================================================
   TIMING PLAN (total ≈ 3 seconds, then redirect)
   ------------------------------------------------------------
   0.0s        → badge pops in, title starts typing letter by letter
   ~1.3s       → title finishes, cursor blinks briefly
   ~1.5s       → subtitle fades in ("Made by PrimeWebTech")
   0 → 3.0s    → loading bar fills across the bottom of the screen
   3.0s        → redirect to login.html
   ============================================================ */
 
const text = "Prime HRM Software";
const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
 
const letterDelay = 0.045;   // seconds between each letter starting
const letterDuration = 0.45; // seconds each letter takes to animate in
 
/* Build the title out of individual animated letter spans */
[...text].forEach((ch, i) => {
 
    const span = document.createElement("span");
    span.className = "char";
    span.textContent = ch === " " ? "\u00A0" : ch;
    span.style.animationDelay = (i * letterDelay) + "s";
 
    titleEl.appendChild(span);
});
 
/* Blinking cursor right after the last letter */
const cursor = document.createElement("span");
cursor.className = "cursor";
titleEl.appendChild(cursor);
 
const titleFinishTime = (text.length * letterDelay + letterDuration) * 1000;
 
/* Show the cursor once typing starts, hide it once subtitle appears */
setTimeout(() => cursor.classList.add("show"), 100);
 
/* Subtitle appears only after the title has fully finished typing */
setTimeout(() => {
    cursor.classList.remove("show");
    subtitleEl.classList.add("show");
}, titleFinishTime + 150);
 
/* FLOATING PARTICLES — a handful of glowing dots drifting upward at
   random horizontal positions and speeds, purely decorative */
const particleContainer = document.getElementById("particles");
 
for (let i = 0; i < 18; i++){
 
    const p = document.createElement("div");
    p.className = "particle";
 
    p.style.left = (Math.random() * 100) + "%";
 
    const duration = 3 + Math.random() * 3;   // 3–6s per rise
    const delay = Math.random() * 3;          // staggered start
 
    p.style.animationDuration = duration + "s";
    p.style.animationDelay = delay + "s";
 
    particleContainer.appendChild(p);
}
 
/* REDIRECT — total experience wraps up at 3 seconds */
setTimeout(() => {
    window.location.href = "login.html";
}, 3000);
 
</script>
</body>
</html>
