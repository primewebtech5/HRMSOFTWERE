<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Software</title>

<style>

/* BODY */

body{
    margin:0;
    font-family:Arial;

    background:linear-gradient(
        -45deg,
        #020617,
        #0f172a,
        #1e3a8a,
        #38bdf8
    );

    background-size:400% 400%;

    animation:bgMove 4s ease infinite;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

    overflow:hidden;

    color:white;
}

/* CENTER BOX */

.box{
    text-align:center;
    animation:floatBox 4s ease-in-out infinite;
}

/* MAIN TITLE */

.title{

    font-size:40px;
    font-weight:bold;

    background:rgba(255,255,255,0.15);

    padding:15px 30px;

    border-radius:20px;

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:
    0 0 20px rgba(56,189,248,0.5),
    0 0 40px rgba(30,58,138,0.3);

    animation:zoomIn 1.5s ease;
}

/* SUBTITLE */

.subtitle{

    margin-top:15px;

    font-size:15px;

    letter-spacing:2px;

    opacity:0.9;

    animation:fadeText 2s ease;
}

/* BACKGROUND ANIMATION */

@keyframes bgMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* TITLE ANIMATION */

@keyframes zoomIn{

    from{
        opacity:0;
        transform:scale(0.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* FLOAT EFFECT */

@keyframes floatBox{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* SUBTEXT */

@keyframes fadeText{

    from{
        opacity:0;
        letter-spacing:10px;
    }

    to{
        opacity:0.9;
        letter-spacing:2px;
    }
}

/* MOBILE */

@media(max-width:600px){

    .title{
        font-size:28px;
        padding:12px 20px;
    }

    .subtitle{
        font-size:13px;
    }
}

</style>
</head>

<body>

<div class="box">

    <div class="title">
        Prime HRM Software
    </div>

    <div class="subtitle">
        Made by PrimeWebTech
    </div>

</div>

<script>

/* REDIRECT */

setTimeout(()=>{

    window.location.href = "login.html";

},4000);

</script>

</body>
</html>
