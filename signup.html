<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Secure Signup</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial;
background:linear-gradient(135deg,#0f172a,#334155,#64748b);

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;
}

/* BOX */

.box{

    width:100%;

    max-width:360px;

    text-align:center;

    animation:fade 0.5s ease;
}

/* TITLE */

h2{

    margin-bottom:20px;

    color:#0d6efd;

    font-size:30px;
}

/* INPUT */

input{

    width:100%;

    padding:14px;

    margin:10px 0;

    border-radius:10px;

    border:1px solid #ccc;

    outline:none;

    transition:0.3s;

    font-size:15px;
}

input:focus{

    border-color:#0d6efd;

    box-shadow:
    0 0 6px #0d6efd;
}

/* BUTTON */

button{

    width:100%;

    padding:14px;

    background:#0d6efd;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:16px;

    margin-top:12px;

    transition:0.3s;
}

button:hover{

    background:#0b5ed7;

    transform:scale(1.02);
}

/* LINK */

.link{

    margin-top:18px;
}

.link a{

    text-decoration:none;

    color:#0d6efd;

    font-weight:bold;

    font-size:15px;
}

.link a:hover{

    text-decoration:underline;
}

/* ERROR */

.error{

    color:red;

    font-size:13px;

    text-align:left;

    margin-top:5px;
}

/* MOBILE */

@media(max-width:500px){

    .box{

        padding:25px 20px;

        border-radius:15px;
    }

    h2{

        font-size:25px;
    }

    input{

        padding:12px;

        font-size:14px;
    }

    button{

        padding:12px;

        font-size:15px;
    }

    .link a{

        font-size:14px;
    }
}

/* ANIMATION */

@keyframes fade{

    from{

        opacity:0;

        transform:translateY(20px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

</style>
</head>

<body oncontextmenu="return false">

<div class="box">

<h2>🔐 Create Account</h2>

<input
type="text"
id="username"
placeholder="Username"
autocomplete="off">

<input
type="password"
id="password"
placeholder="Password"
autocomplete="new-password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
autocomplete="new-password">

<div style="margin-top:15px;text-align:left;">

<label style="font-weight:bold;">
Security Verification
</label>

<div style="
display:flex;
gap:10px;
margin-top:8px;
align-items:center;
">

<div id="captchaBox"
style="
background:#e2e8f0;
padding:12px 18px;
border-radius:10px;
font-size:18px;
font-weight:bold;
min-width:110px;
text-align:center;
">
0 + 0
</div>

<button
type="button"
onclick="generateCaptcha()"
style="
width:55px;
margin:0;
padding:12px;
">
🔄
</button>

</div>

<input
type="number"
id="captchaAnswer"
placeholder="Enter Answer">

</div>

<div class="error" id="error"></div>

<button onclick="signup()">
Signup
</button>

<div class="link">

<a href="login.html">

Already have account? Login

</a>

</div>

</div>

<script>

let captchaResult = 0;

function generateCaptcha(){

    let a = Math.floor(Math.random()*10)+1;

    let b = Math.floor(Math.random()*10)+1;

    captchaResult = a + b;

    document.getElementById("captchaBox").innerHTML =
    a + " + " + b;

    document.getElementById("captchaAnswer").value = "";

}

/* GOOGLE SHEET API */

const API_URL =
"https://script.google.com/macros/s/AKfycbye7Y5dbCH3M8Ep2NvDCk1P2AJ3natbDzpQ_U9oG0WZR-AX7aNxYedCTWYIsyK3Yb9i/exec";

/* SIGNUP FUNCTION */

async function signup(){

    let user =
    document
    .getElementById("username")
    .value
    .trim();

    let pass =
    document
    .getElementById("password")
    .value
    .trim();

    let confirmPass =
    document
    .getElementById("confirmPassword")
    .value
    .trim();

let captcha =
document.getElementById("captchaAnswer")
.value
.trim();

    let error =
    document
    .getElementById("error");

    error.innerText = "";

 /* VALIDATION */

if(user.length < 3){

    error.innerText =
    "Username must be at least 3 characters";

    return;
}

// 👇 અહીં નવો Password Validation

let letters = (pass.match(/[A-Za-z]/g) || []).length;
let numbers = (pass.match(/[0-9]/g) || []).length;
let symbols = (pass.match(/[^A-Za-z0-9]/g) || []).length;

if(letters < 5){

    error.innerText =
    "Password must contain at least 5 letters";

    return;
}

if(numbers < 5){

    error.innerText =
    "Password must contain at least 5 numbers";

    return;
}

if(symbols < 1){

    error.innerText =
    "Password must contain at least 1 special symbol";

    return;
}

if(pass !== confirmPass){

    error.innerText =
    "Passwords do not match";

    return;
}

    try{
        showLoader();
        await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify({

                username:user,

                password:pass
            })
        });

        hideLoader();

alert("✅ Account Created Successfully");

document.getElementById("username").value="";
document.getElementById("password").value="";
document.getElementById("confirmPassword").value="";
document.getElementById("captchaAnswer").value="";

        generateCaptcha();


        window.location.href =
        "login.html";

}catch(err){

    hideLoader();

    console.log(err);

    error.innerText="Server Error ❌";

}
}
document.getElementById("username").value="";
document.getElementById("password").value="";
document.getElementById("confirmPassword").value="";
document.getElementById("captchaAnswer").value="";

/* ENTER KEY SIGNUP */

document
.getElementById("password")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){

        signup();
    }
});

/* 🚫 BLOCK COPY */

document.addEventListener(
"copy",
e => e.preventDefault()
);

/* 🚫 BLOCK PASTE */

document.addEventListener(
"paste",
e => e.preventDefault()
);

/* 🚫 BLOCK CUT */

document.addEventListener(
"cut",
e => e.preventDefault()
);

/* 🚫 BLOCK RIGHT CLICK */

document.addEventListener(
"contextmenu",
e => e.preventDefault()
);

/* 🚫 BLOCK DEVTOOLS */

document.onkeydown = function(e){

    if(e.keyCode == 123)
    return false;

    if(
        e.ctrlKey &&
        e.shiftKey &&
        e.keyCode == 73
    )
    return false;

    if(
        e.ctrlKey &&
        e.shiftKey &&
        e.keyCode == 74
    )
    return false;

    if(
        e.ctrlKey &&
        e.keyCode == 85
    )
    return false;
}

/* 🚫 BLOCK DRAG */

document.addEventListener(
"dragstart",
e => e.preventDefault()
);

generateCaptcha();

function showLoader(){

document.getElementById("loader").style.display="flex";

    document.querySelector("button").disabled=true;


}

function hideLoader(){

document.getElementById("loader").style.display="none";

    document.querySelector("button").disabled=true;


}

</script>
<div id="loader" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,.9);
justify-content:center;
align-items:center;
z-index:99999;
flex-direction:column;
">

<div style="
width:65px;
height:65px;
border:8px solid #dbeafe;
border-top:8px solid #0d6efd;
border-radius:50%;
animation:spin 1s linear infinite;
"></div>

<h3 style="margin-top:20px;color:#0d6efd;">
Creating Account...
</h3>

</div>
</body>
</html>
