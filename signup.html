<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Signup</title>

<style>

body{
    font-family:Arial;
    background:linear-gradient(135deg,#0d6efd,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

/* BOX */
.box{
    background:white;
    padding:35px;
    border-radius:15px;
    width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
}

h2{
    margin-bottom:20px;
    color:#0d6efd;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    outline:none;
    transition:0.3s;
}

input:focus{
    border-color:#0d6efd;
    box-shadow:0 0 5px #0d6efd;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:10px;
}

button:hover{
    background:#0b5ed7;
}

/* EXIT BUTTON */
.exit{
    position:fixed;
    top:15px;
    right:15px;
    background:#ef4444;
    padding:8px 12px;
    border-radius:6px;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* LINK */
.link{
    margin-top:15px;
}

.link a{
    text-decoration:none;
    color:#0d6efd;
    font-weight:bold;
}

.link a:hover{
    text-decoration:underline;
}

/* ERROR TEXT */
.error{
    color:red;
    font-size:12px;
    text-align:left;
}

</style>
</head>

<body oncontextmenu="return false">


<div class="box">
<h2>🔐 Create Account</h2>

<input type="text" id="username" placeholder="Username" autocomplete="off">
<input type="password" id="password" placeholder="Password" autocomplete="new-password">

<div class="error" id="error"></div>

<button onclick="signup()">Signup</button>

<div class="link">
<a href="login.html">Already have account? Login</a>
</div>

</div>

<script>

/* SIGNUP */
function signup(){

    let user = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value.trim();
    let error = document.getElementById("error");

    error.innerText = "";

    // VALIDATION
    if(user.length < 3){
        error.innerText = "Username must be at least 3 characters";
        return;
    }

    if(pass.length < 6){
        error.innerText = "Password must be at least 6 characters";
        return;
    }

    // SAVE
    let data = {
        username: user,
        password: pass
    };

fetch("https://script.google.com/macros/s/AKfycbye7Y5dbCH3M8Ep2NvDCk1P2AJ3natbDzpQ_U9oG0WZR-AX7aNxYedCTWYIsyK3Yb9i/exec", {

    method: "POST",

    body: JSON.stringify({
        username: user,
        password: pass
    })

})
.then(res => res.json())
.then(data => {

    alert("Account Created ✅");

    window.location.href = "login.html";

});

    alert("Account Created ✅");

    window.location.href = "login.html";
}

/* 🚫 BLOCK COPY / PASTE */
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("paste", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());

/* 🚫 BLOCK RIGHT CLICK */
document.addEventListener("contextmenu", e => e.preventDefault());

/* 🚫 BLOCK DEVTOOLS (BASIC) */
document.onkeydown = function(e){
    if(e.keyCode == 123) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false;
    if(e.ctrlKey && e.keyCode == 85) return false;
}

/* 🚫 DRAG BLOCK */
document.addEventListener("dragstart", e => e.preventDefault());

</script>

</body>
</html>
