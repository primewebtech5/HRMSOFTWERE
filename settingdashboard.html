<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Quick Access</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#f1f5f9;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    background:#0d6efd;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

/* BACK BUTTON */

.back-btn{
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:white;
    color:#0d6efd;
    font-weight:bold;
    transition:0.3s;
}

.back-btn:hover{
    background:#1e293b;
    color:white;
}

/* CONTAINER */

.container{
    flex:1;
    padding:20px;
}

/* BUTTON GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:18px;
}

/* BUTTON CARD */

.btn{
    background:white;
    padding:25px 15px;
    border-radius:15px;
    text-align:center;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
    border:2px solid transparent;
}

.btn:hover{
    background:#0d6efd;
    color:white;
    transform:translateY(-5px);
    border-color:#1e293b;
}

/* ICON */

.icon{
    font-size:32px;
    margin-bottom:10px;
}

/* FOOTER */

.footer{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:12px;
    font-size:13px;
}

/* MOBILE RESPONSIVE */

@media(max-width:768px){

    .header{
        flex-direction:column;
        text-align:center;
    }

    .logo{
        font-size:20px;
    }

    .container{
        padding:15px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .btn{
        padding:20px 10px;
        font-size:14px;
    }

    .icon{
        font-size:28px;
    }

}

@media(max-width:480px){

    .grid{
        grid-template-columns:1fr;
    }

    .btn{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        Prime Software
    </div>

    <button
    class="back-btn"
    onclick="go('dashboard.html')">

    ⬅ Back

    </button>

</div>

<!-- MAIN -->

<div class="container">

    <div class="grid">

        <!-- RESET PASSWORD -->

        <div
        class="btn"
        onclick="go('signup.html')">

            <div class="icon">
                🔐
            </div>

            Reset Password

        </div>

        <!-- EMPTY -->

        <div
        class="btn"
        onclick="alert('Coming Soon 🚀')">

            <div class="icon">
                ⚡
            </div>

            Empty

        </div>

        <!-- EXTRA -->

        <div
        class="btn"
        onclick="alert('New Feature Soon 🔥')">

            <div class="icon">
                📊
            </div>

            Reports

        </div>

        <!-- EXTRA -->

        <div
        class="btn"
        onclick="alert('Backup Feature Soon 💾')">

            <div class="icon">
                💾
            </div>

            Backup

        </div>

    </div>

</div>

<!-- FOOTER -->

<div class="footer">

    © 2022 - 2026 | Made by PrimeWebTech

</div>

<script>

function go(page){

    window.location.href = page;
}

</script>

</body>
</html>
