<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Master</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f1f5f9;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1e293b;
    padding:15px 20px;
    color:white;
    flex-wrap:wrap;
    gap:10px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.menu button{
    background:transparent;
    border:none;
    color:white;
    padding:8px 10px;
    cursor:pointer;
    border-radius:6px;
}

.menu button:hover{
    background:#38bdf8;
    color:black;
}

.active{
    background:#38bdf8 !important;
    color:black !important;
}

/* CONTAINER */
.container{
    padding:15px;
}

/* TOP CARD */
.stock-top{
    text-align:center;
    background:#1e293b;
    color:white;
    padding:15px;
    border-radius:10px;
}

/* MATERIAL GRID */
.material-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:15px;
}

.material-box{
    background:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* BOX */
.box{
    background:white;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
}

/* FORM */
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

input,select{
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

/* BUTTON */
.btn{
    background:#1e293b;
    color:white;
    border:none;
    padding:10px 12px;
    border-radius:6px;
    cursor:pointer;
    margin:5px 0;
}

.btn:hover{
    background:#38bdf8;
    color:black;
}

/* TABLE WRAPPER */
.table-wrapper{
    width:100%;
    overflow-x:auto;
    margin-top:15px;
}

/* TABLE */
table{
    width:100%;
    min-width:800px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
    font-size:14px;
}

th{
    background:#1e293b;
    color:white;
}

/* RESPONSIVE */
@media(max-width:900px){

    .material-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .material-grid{
        grid-template-columns:1fr;
    }

    .btn{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="header">
    <div class="logo">Uniform Stock</div>

    <div class="menu">
        <a href="uniform.html"><button>Home</button></a>
        <a href="entry.html"><button>Entry</button></a>
        <a href="#"><button class="active">Stock</button></a>
        <a href="vendor.html"><button>Vendor</button></a>
        <a href="setting.html"><button>Setting</button></a>
        <a href="dashboard.html"><button>Exit</button></a>
    </div>
</div>

<div class="container">

<!-- TOP -->
<div class="stock-top">
    <h2>Available Stock</h2>
    <h3 id="totalStock">0</h3>
    <h4>Total Value: ₹ <span id="totalValue">0</span></h4>
</div>

<!-- MATERIAL GRID -->
<div class="material-grid" id="materialGrid"></div>

<!-- FORM -->
<div class="box">
<h3>Add Stock</h3>

<div class="form-grid">

<select id="material"></select>
<input type="number" id="price" placeholder="Price">
<input type="number" id="pair" placeholder="Pair">
<input type="date" id="pdate">
<input type="text" id="remarks" placeholder="Remarks">

</div>

<button class="btn" onclick="addStock()">Add</button>
<button class="btn" onclick="exportExcel()">Excel</button>
<button class="btn" onclick="exportPDF()">PDF</button>

</div>

<!-- TABLE -->
<div class="box">
<h3>Stock History</h3>

<input type="text" id="search" placeholder="Search..." onkeyup="searchData()">

<div class="table-wrapper">

<table>
<thead>
<tr>
<th>SR</th>
<th>Material</th>
<th>Price</th>
<th>Pair</th>
<th>Date</th>
<th>Remarks</th>
<th>Action</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyNxwv4nONHJ4vqRxNqkSDcqb70esqPB52-RVwzT5AbBunwQxct1AbiSjmvz0nllFkM/exec";

let stockData = [];
let materials = [];

/* LOAD MATERIAL */
async function loadMaterials(){

    let res = await fetch(API_URL+"?sheet=Material_Master");
    let data = await res.json();

    material.innerHTML = "";

    data.slice(1).forEach(m=>{
        materials.push(m[0]);
        material.innerHTML += `<option>${m[0]}</option>`;
    });
}

/* ADD STOCK */
async function addStock(){

    let obj = {
        sheet:"Stock_Entry",
        material:material.value,
        price:price.value,
        pair:pair.value,
        date:pdate.value,
        remarks:remarks.value
    };

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(obj)
    });

    alert("Saved");
    render();
}

/* RENDER */
async function render(){

    let stock = await fetch(API_URL+"?sheet=Stock_Entry").then(r=>r.json());
    let entry = await fetch(API_URL+"?sheet=Employee_Entry").then(r=>r.json());

    stockData = [];
    tbody.innerHTML = "";

    stock.slice(1).forEach((d,i)=>{

        let obj = {
            material:d[0],
            price:d[1],
            pair:d[2],
            date:d[3],
            remarks:d[4],
            row:i+2
        };

        stockData.push(obj);

        tbody.innerHTML += `
        <tr>
            <td>${i+1}</td>
            <td>${obj.material}</td>
            <td>${obj.price}</td>
            <td>${obj.pair}</td>
            <td>${obj.date}</td>
            <td>${obj.remarks}</td>
            <td>
                <button onclick="deleteRow(${i})">Del</button>
            </td>
        </tr>`;
    });

    let count = {};
    materials.forEach(m=>count[m]=0);

    stockData.forEach(d=>{
        count[d.material]+=Number(d.pair||0);
    });

    entry.slice(1).forEach(d=>{
        let mat=d[7];
        let p=Number(d[6]||0);
        if(count[mat]!=undefined) count[mat]-=p;
    });

    materialGrid.innerHTML="";

    let total=0;

    for(let m in count){

        total+=count[m];

        materialGrid.innerHTML+=`
        <div class="material-box">
            ${m}
            <h2>${count[m]}</h2>
        </div>`;
    }

    totalStock.innerText=total;

    let value=0;

    stockData.forEach(d=>{
        value+=Number(d.price||0);
    });

    totalValue.innerText=value;
}

/* SEARCH */
function searchData(){
    let val=search.value.toLowerCase();
    document.querySelectorAll("#tbody tr").forEach(r=>{
        r.style.display=r.innerText.toLowerCase().includes(val)?"":"none";
    });
}

/* INIT */
loadMaterials().then(render);

</script>

</body>
</html>
