<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniform Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#e2e8f0,#f8fafc);
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1e293b;
    padding:15px 20px;
    color:white;
    flex-wrap:wrap;
    gap:10px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.menu button{
    background:transparent;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
}

.menu button:hover{
    background:#38bdf8;
    color:black;
}

.active{
    background:#38bdf8 !important;
    color:black !important;
}

/* MAIN */
.container{
    display:flex;
    gap:20px;
    padding:20px;
    flex:1;
}

/* ALERT */
.alert-box{
    width:30%;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    max-height:80vh;
    overflow:auto;
}

.alert-item{
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    background:#fee2e2;
}

.overdue{
    background:#dc2626;
    color:white;
}

/* RIGHT */
.graph-box{
    width:70%;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* SUMMARY */
.summary-box{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.summary-card{
    background:#f1f5f9;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

/* MATERIAL GRID */
.material-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:15px;
}

.material-box{
    background:#f1f5f9;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

/* FOOTER */
.footer{
    background:#1f2937;
    color:#cbd5e1;
    text-align:center;
    padding:10px;
}

/* RESPONSIVE */
@media (max-width:900px){

    .container{
        flex-direction:column;
    }

    .alert-box,
    .graph-box{
        width:100%;
    }

    .summary-box{
        grid-template-columns:1fr;
    }

    .material-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media (max-width:500px){

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .menu{
        width:100%;
    }

    .material-grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<div class="header">
    <div class="logo">Uniform Dashboard</div>

    <div class="menu">
        <a href="#"><button class="active">Home</button></a>
        <a href="entry.html"><button>Entry</button></a>
        <a href="stock.html"><button>Stock</button></a>
        <a href="vendor.html"><button>Vendor</button></a>
        <a href="setting.html"><button>Setting</button></a>
        <a href="dashboard.html"><button>Exit</button></a>
    </div>
</div>

<div class="container">

<!-- ALERT -->
<div class="alert-box">
<h3>⚠ Due Alerts</h3>
<div id="alerts"></div>
</div>

<!-- RIGHT -->
<div class="graph-box">

<h3>📊 Summary</h3>

<div class="summary-box">

<div class="summary-card">
<h2 id="totalUniform">0</h2>
<p>Total Uniform Given</p>
</div>

<div class="summary-card">
<h2 id="totalStock">0</h2>
<p>Available Stock</p>
</div>

<div class="summary-card">
<h2>₹ <span id="grandTotal">0</span></h2>
<p>Total Investment</p>
</div>

</div>

<h3 style="margin-top:20px;">📦 Material Stock</h3>

<div class="material-grid" id="materialGrid"></div>

</div>

</div>

<div class="footer">
© 2026 Uniform System | Made by Prime
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyNxwv4nONHJ4vqRxNqkSDcqb70esqPB52-RVwzT5AbBunwQxct1AbiSjmvz0nllFkM/exec";

let today = new Date();

/* FORMAT */
function formatDate(d){
    if(!d) return "";
    let x = new Date(d);
    return x.toISOString().split("T")[0];
}

/* LOAD DASHBOARD */
async function loadDashboard(){

    let entry = await fetch(API_URL + "?sheet=Employee_Entry").then(r=>r.json());
    let stock = await fetch(API_URL + "?sheet=Stock_Entry").then(r=>r.json());
    let mat = await fetch(API_URL + "?sheet=Material_Master").then(r=>r.json());

    loadAlerts(entry);
    loadSummary(entry, stock, mat);
}

/* ALERTS */
function loadAlerts(entry){

    alerts.innerHTML = "";

    let found = false;

    entry.slice(1).forEach(d=>{

        let name = d[3];
        let due = d[8];

        if(!due) return;

        let diff = (new Date(due) - today)/(1000*60*60*24);

        if(diff < 0){
            found = true;
            alerts.innerHTML += `
            <div class="alert-item overdue">
            ❌ ${name}<br>${formatDate(due)}
            </div>`;
        }
        else if(diff <= 30){
            found = true;
            alerts.innerHTML += `
            <div class="alert-item">
            ⚠ ${name}<br>${formatDate(due)}
            </div>`;
        }
    });

    if(!found){
        alerts.innerHTML = `<div class="alert-item">No Alerts 🎉</div>`;
    }
}

/* SUMMARY */
function loadSummary(entry, stock, mat){

    document.getElementById("totalUniform").innerText = entry.length - 1;

    let m = {};

    mat.slice(1).forEach(x=>{
        m[x[0]] = 0;
    });

    stock.slice(1).forEach(x=>{
        let matName = x[0];
        let qty = Number(x[2]||0);
        if(m[matName] != undefined) m[matName] += qty;
    });

    entry.slice(1).forEach(x=>{
        let matName = x[7];
        let qty = Number(x[6]||0);
        if(m[matName] != undefined) m[matName] -= qty;
    });

    materialGrid.innerHTML = "";

    let totalStock = 0;

    for(let k in m){

        totalStock += m[k];

        materialGrid.innerHTML += `
        <div class="material-box">
            ${k}
            <h2>${m[k]}</h2>
        </div>`;
    }

    document.getElementById("totalStock").innerText = totalStock;

    let total = 0;

    stock.slice(1).forEach(x=>{
        total += Number(x[1]||0) * Number(x[2]||0);
    });

    document.getElementById("grandTotal").innerText = total;
}

loadDashboard();

</script>

</body>
</html>
