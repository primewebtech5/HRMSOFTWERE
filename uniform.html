
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniform Register</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#e2e8f0,#f8fafc);
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1e293b;
    padding:15px 30px;
    color:white;
}

.logo {
    font-size:22px;
    font-weight:bold;
}

.menu {
    display:flex;
    gap:20px;
}

.menu button {
    background:transparent;
    border:none;
    color:white;
    padding:8px 12px;
    cursor:pointer;
    border-radius:6px;
}

.menu button:hover {
    background:#38bdf8;
    color:black;
}

.active {
    background:#38bdf8 !important;
    color:black !important;
}

/* MAIN */
.container{
    display:flex;
    padding:30px;
    gap:25px;
    flex:1;
}

/* ALERT */
.alert-box{
    width:30%;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.alert-item{
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    background:#fee2e2;
}

.overdue{
    background:#dc2626;
    color:white;
}

/* RIGHT */
.graph-box{
    width:70%;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* MATERIAL GRID */
.material-grid{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:15px;
    margin-top:15px;
}

.material-box{
    background:#f1f5f9;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

/* FOOTER */
.footer{
    background:#1f2937;
    color:#cbd5f5;
    text-align:center;
    padding:10px;
}

.summary-box{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.summary-card{
    background:#f1f5f9;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

@media(max-width:900px){

    .container{
        flex-direction:column;
    }

    .alert-box,
    .graph-box{
        width:100%;
    }

    .material-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .summary-box{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">Uniform Register</div>

    <div class="menu">
        <a href="#"><button class="active">Home</button></a>
        <a href="entry.html"><button>Data Entry</button></a>
        <a href="stock.html"><button>Stock Management</button></a>
        <a href="vendor.html"><button>Vendor Management</button></a>
        <a href="setting.html"><button>Setting</button></a>
        <a href="dashboard.html"><button>Exit</button></a>
    </div>
</div>

<div class="container">

<!-- ALERT -->
<div class="alert-box">
<h3>⚠ Due Alerts</h3>
<div id="alerts"></div>
</div>

<!-- RIGHT -->
<div class="graph-box">

<h3>📊 Summary</h3>

<div class="summary-box">

<div class="summary-card">
<h2 id="totalUniform">0</h2>
<p>Total Given Uniform</p>
</div>

<div class="summary-card">
<h2 id="totalStock">0</h2>
<p>Available Stock</p>
</div>

<div class="summary-card">
<h2>₹ <span id="grandTotal">0</span></h2>
<p>Total Investment</p>
</div>

</div>

<h3>📦 Current Material Stock</h3>
<div class="material-grid" id="materialGrid"></div>

</div>

</div>

<div class="footer">
© 2026 | Made By Prime Developers
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyNxwv4nONHJ4vqRxNqkSDcqb70esqPB52-RVwzT5AbBunwQxct1AbiSjmvz0nllFkM/exec";

let today = new Date();

/* ================= FORMAT DATE ================= */

function formatDate(dateStr){

    if(!dateStr) return "";

    let d = new Date(dateStr);

    let year = d.getFullYear();

    let month = String(d.getMonth()+1).padStart(2,'0');

    let day = String(d.getDate()).padStart(2,'0');

    return `${year}-${month}-${day}`;
}

/* ================= LOAD DASHBOARD ================= */

async function loadDashboard(){

    // EMPLOYEE ENTRY
    let entryRes = await fetch(API_URL + "?sheet=Employee_Entry");

    let entryData = await entryRes.json();

    // STOCK ENTRY
    let stockRes = await fetch(API_URL + "?sheet=Stock_Entry");

    let stockData = await stockRes.json();

    // MATERIAL MASTER
    let matRes = await fetch(API_URL + "?sheet=Material_Master");

    let matData = await matRes.json();

    loadAlerts(entryData);

    loadSummary(entryData, stockData, matData);
}

/* ================= DUE ALERTS ================= */

function loadAlerts(entryData){

    alerts.innerHTML = "";

    let found = false;

    entryData.slice(1).forEach(d=>{

        let empName = d[3];

        let dueDate = d[8];

        if(!dueDate) return;

        let due = new Date(dueDate);

        let diff = (due - today) / (1000*60*60*24);

        // OVERDUE
        if(diff < 0){

            found = true;

            alerts.innerHTML += `
            <div class="alert-item overdue">
            ❌ <b>${empName}</b><br>
            Due Date: ${formatDate(dueDate)}
            </div>`;
        }

        // NEXT 30 DAYS
        else if(diff <= 30){

            found = true;

            alerts.innerHTML += `
            <div class="alert-item">
            ⚠ <b>${empName}</b><br>
            Due Date: ${formatDate(dueDate)}
            </div>`;
        }

    });

    if(!found){

        alerts.innerHTML = `
        <div class="alert-item">
        No Due Alerts 🎉
        </div>`;
    }
}

/* ================= SUMMARY ================= */

function loadSummary(entryData, stockData, matData){

    // TOTAL GIVEN UNIFORM
    document.getElementById("totalUniform").innerText = entryData.length - 1;

    // MATERIAL LIST
    let materials = {};

    matData.slice(1).forEach(m=>{

        materials[m[0]] = 0;

    });

    // STOCK ADD
    stockData.slice(1).forEach(d=>{

        let material = d[0];

        let pair = Number(d[2] || 0);

        if(materials[material] != undefined){

            materials[material] += pair;

        }

    });

    // STOCK MINUS FROM EMPLOYEE ENTRY
    entryData.slice(1).forEach(d=>{

        let material = d[7];

        let pair = Number(d[6] || 0);

        if(materials[material] != undefined){

            materials[material] -= pair;

        }

    });

    // MATERIAL GRID
    materialGrid.innerHTML = "";

    let totalStock = 0;

    for(let m in materials){

        totalStock += materials[m];

        let bgColor = materials[m] <= 5
        ? "#fee2e2"
        : "#f1f5f9";

        materialGrid.innerHTML += `
        <div class="material-box" style="background:${bgColor}">

            <div>${m}</div>

            <h2>${materials[m]}</h2>

        </div>`;
    }

    document.getElementById("totalStock").innerText = totalStock;

    // TOTAL INVESTMENT
    let grandTotal = 0;

    stockData.slice(1).forEach(d=>{

        let price = Number(d[1] || 0);

        let pair = Number(d[2] || 0);

        grandTotal += (price * pair);

    });

    document.getElementById("grandTotal").innerText = grandTotal;
}

/* ================= INIT ================= */

loadDashboard();

</script>

</body>
</html>
