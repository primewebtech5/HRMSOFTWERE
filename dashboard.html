<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime E.M.S — Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --ink:#0c1220;
    --panel:#121a2b;
    --panel-2:#182338;
    --hair:#25314a;
    --steel:#8592ab;
    --paper:#f3f5f9;
    --paper-line:#dfe4ee;
    --ink-text:#101726;
    --amber:#f2a93b;
    --amber-deep:#c9821f;
    --danger:#e2534d;
    --danger-deep:#b73a35;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
}

body{
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    color:var(--ink-text);
    background:var(--paper);
}

button{
    font-family:inherit;
}

button:focus-visible,
a:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
}

/* ================= TITLE BAR ================= */

.title-bar{
    width:100%;
    background:var(--ink);
    color:var(--steel);
    text-align:center;
    padding:6px 10px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:500;
    letter-spacing:2px;
    text-transform:uppercase;
    border-bottom:1px solid var(--hair);
}

.title-bar b{
    color:var(--amber);
    font-weight:600;
}

.title-bar .live-dot{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-left:14px;
    color:#6fe08a;
}

.live-dot::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:#6fe08a;
    box-shadow:0 0 0 0 rgba(111,224,138,0.6);
    animation:pulse-dot 1.8s ease-out infinite;
}

@keyframes pulse-dot{
    0%{ box-shadow:0 0 0 0 rgba(111,224,138,0.55); }
    70%{ box-shadow:0 0 0 7px rgba(111,224,138,0); }
    100%{ box-shadow:0 0 0 0 rgba(111,224,138,0); }
}

/* ================= INFO BAR ================= */

.info-bar{
    width:100%;
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:22px;
    padding:8px 20px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--hair);
}

.info-stat{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1.25;
}

.info-stat .val{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-weight:600;
    color:#e7ecf6;
    letter-spacing:1px;
}

#clock{
    color:var(--amber);
    text-shadow:0 0 12px rgba(242,169,59,0.45);
}

.info-stat .lbl{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    font-weight:500;
    color:var(--steel);
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.logout-btn{
    background:linear-gradient(135deg,var(--danger),var(--danger-deep));
    border:none;
    color:white;
    padding:8px 16px;
    border-radius:4px;
    cursor:pointer;
    font-weight:600;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    font-family:'JetBrains Mono',monospace;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
}

.logout-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 16px -6px rgba(226,83,77,0.6);
}

/* ================= TOOLBAR — bold badge grid ================= */

.toolbar{
    width:100%;
    background:var(--ink);
    display:flex;
    flex-wrap:wrap;
    padding:22px 20px 26px;
    gap:14px;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.toolbar::before{
    content:"ACCESS MODULES";
    position:absolute;
    top:6px;
    left:20px;
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    letter-spacing:2px;
    color:var(--steel);
    text-transform:uppercase;
}

.tool-btn{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:space-between;
    width:128px;
    height:112px;
    background:var(--panel);
    border:2px solid var(--hair);
    border-radius:10px;
    cursor:pointer;
    padding:12px 14px;
    text-align:left;
    transition:border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    overflow:hidden;
    opacity:0;
    animation:badge-in 0.55s cubic-bezier(.2,.7,.3,1) forwards;
}

/* right-to-left staggered entrance: rightmost card moves first */
.tool-btn:nth-child(1){ animation-delay:0.42s; }
.tool-btn:nth-child(2){ animation-delay:0.36s; }
.tool-btn:nth-child(3){ animation-delay:0.30s; }
.tool-btn:nth-child(4){ animation-delay:0.24s; }
.tool-btn:nth-child(5){ animation-delay:0.18s; }
.tool-btn:nth-child(6){ animation-delay:0.12s; }
.tool-btn:nth-child(7){ animation-delay:0.06s; }
.tool-btn:nth-child(8){ animation-delay:0s; }

@keyframes badge-in{
    from{ opacity:0; transform:translateX(90px); }
    to{ opacity:1; transform:translateX(0); }
}

.tool-btn::after{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width:40%;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(242,169,59,0.2),transparent);
    transform:skewX(-20deg);
    transition:left 0.6s ease;
    pointer-events:none;
}

.tool-btn:hover::after{
    left:130%;
}

/* badge lanyard notch */
.tool-btn::before{
    content:"";
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:22px;
    height:14px;
    background:var(--ink);
    border:2px solid var(--hair);
    border-top:none;
    border-radius:0 0 8px 8px;
}

.tool-btn:hover{
    border-color:var(--amber);
    background:var(--panel-2);
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 14px 28px -12px rgba(242,169,59,0.45);
}

.tool-btn:hover::before{
    border-color:var(--amber);
}

.tool-btn:hover .icon{
    transform:scale(1.2) rotate(-4deg);
}

.tool-btn:hover .label{
    color:var(--amber);
}

.tool-btn .code{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--amber);
}

.tool-btn .icon{
    font-size:23px;
    line-height:1;
    display:inline-block;
    transition:transform 0.25s ease;
}

.tool-btn span.label{
    font-family:'Space Grotesk',sans-serif;
    font-size:13.5px;
    font-weight:700;
    color:#e7ecf6;
    line-height:1.25;
    transition:color 0.2s ease;
}

/* ================= CANVAS ================= */

.canvas{
    flex:1;
    width:100%;
    background:
        linear-gradient(180deg,var(--paper) 0%,#eef1f7 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    min-height:220px;
}

.canvas::before{
    content:"";
    position:absolute;
    inset:-42px;
    background-image:
        linear-gradient(var(--paper-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size:42px 42px;
    opacity:0.6;
    mask-image:radial-gradient(circle at 50% 50%, black 0%, transparent 75%);
    animation:grid-drift 14s linear infinite;
}

@keyframes grid-drift{
    from{ background-position:0 0, 0 0; }
    to{ background-position:42px 42px, 42px 42px; }
}

.canvas .scanline{
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    background:linear-gradient(180deg,transparent,var(--amber) 50%,transparent);
    opacity:0.55;
    animation:sweep 5s linear infinite;
}

@keyframes sweep{
    0%{ left:100%; }
    100%{ left:0%; }
}

.brand-wrap{
    position:relative;
    text-align:center;
}

.brand-name{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(30px,6vw,52px);
    font-weight:700;
    letter-spacing:10px;
    color:var(--ink-text);
    opacity:0.9;
    animation:brand-glow 4s ease-in-out infinite;
}

@keyframes brand-glow{
    0%,100%{ text-shadow:0 0 0 rgba(242,169,59,0); }
    50%{ text-shadow:0 0 26px rgba(242,169,59,0.28); }
}

.brand-sub{
    margin-top:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:3px;
    color:#5b6478;
    text-transform:uppercase;
}

.brand-ticker{
    margin-top:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    color:#8592ab;
}

.brand-ticker b{
    color:var(--amber-deep);
    font-weight:700;
}

/* ================= STATUS BAR ================= */

.status-bar{
    width:100%;
    background:var(--ink);
    border-top:1px solid var(--hair);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 20px;
    flex-wrap:wrap;
    gap:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
}

.status-bar .month{
    color:var(--amber);
    font-weight:600;
    letter-spacing:1px;
}

.status-bar .welcome{
    color:#c8d0e0;
    font-weight:500;
    letter-spacing:0.5px;
}

.status-bar .welcome b{
    color:#e7ecf6;
    font-weight:700;
}

/* ================= REDUCED MOTION ================= */

@media (prefers-reduced-motion: reduce){
    .canvas .scanline,
    .canvas::before,
    .brand-name,
    .live-dot::before{
        animation:none;
        display:none;
    }
    .tool-btn{
        opacity:1;
        animation:none;
    }
    .tool-btn,
    .logout-btn,
    .tool-btn .icon,
    .tool-btn span.label{
        transition:none;
    }
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .info-bar{
        justify-content:space-between;
    }

    .info-stat{
        align-items:flex-start;
    }

    .tool-btn{
        width:calc(50% - 7px);
    }

    .brand-name{
        letter-spacing:6px;
    }

}

@media(max-width:420px){
    .tool-btn{
        width:100%;
        flex-direction:row;
        align-items:center;
        height:auto;
        padding:12px 14px;
        gap:12px;
    }
    .tool-btn::before{
        display:none;
    }
    .tool-btn .code{
        position:absolute;
        top:8px;
        right:12px;
    }
}

</style>
</head>

<body>

<!-- TITLE BAR -->

<div class="title-bar">
    Prime E.M.S <b>1.0.0(a)</b>
    <span class="live-dot">SYSTEM LIVE</span>
</div>

<!-- INFO BAR: clock, date, day, logout -->

<div class="info-bar">

    <div class="info-stat">
        <span class="val" id="clock"></span>
        <span class="lbl">Time</span>
    </div>

    <div class="info-stat">
        <span class="val" id="dateBox"></span>
        <span class="lbl" id="dayBox"></span>
    </div>

    <button class="logout-btn" onclick="go('login.html')">
        Logout
    </button>

</div>

<!-- TOOLBAR: 8 access-badge buttons -->

<div class="toolbar">

    <button class="tool-btn" onclick="go('employeedashboard.html')">
        <span class="code">EM · 01</span>
        <span class="icon">🧑🏻‍💼</span>
        <span class="label">Employee Management</span>
    </button>

    <button class="tool-btn" onclick="go('interview_detail.html')">
        <span class="code">CM · 02</span>
        <span class="icon">👨🏻‍💼</span>
        <span class="label">Candidate Management</span>
    </button>

    <button class="tool-btn" onclick="go('uniform.html')">
        <span class="code">UM · 03</span>
        <span class="icon">👔</span>
        <span class="label">Uniform Management</span>
    </button>

    <button class="tool-btn" onclick="go('attendance_dashboard.html')">
        <span class="code">AT · 04</span>
        <span class="icon">📅</span>
        <span class="label">Attendance</span>
    </button>

    <button class="tool-btn" onclick="go('data.html')">
        <span class="code">DC · 05</span>
        <span class="icon">📁</span>
        <span class="label">Document Center</span>
    </button>

    <button class="tool-btn" onclick="go('settingdashboard.html')">
        <span class="code">ST · 06</span>
        <span class="icon">⚙️</span>
        <span class="label">Settings</span>
    </button>

    <button class="tool-btn" onclick="go('notif.html')">
        <span class="code">NT · 07</span>
        <span class="icon">🔔</span>
        <span class="label">Notification</span>
    </button>

    <button class="tool-btn" onclick="go('error.html')">
        <span class="code">TS · 08</span>
        <span class="icon">🛠️</span>
        <span class="label">Technical Support</span>
    </button>

</div>

<!-- CANVAS -->

<div class="canvas">
    <div class="scanline"></div>
    <div class="brand-wrap">
        <div class="brand-name">PRIME</div>
        <div class="brand-sub">Employee Management System</div>
        <div class="brand-ticker">Session uptime — <b id="uptime">00:00:00</b></div>
    </div>
</div>

<!-- STATUS BAR -->

<div class="status-bar">

    <span class="month" id="monthBox"></span>

    <span class="welcome">
        Welcome : <b id="userName">ADMIN</b>
    </span>

</div>

<script>

function go(page){
    window.location.href = page;
}

/* live clock / date / day */

function updateClock(){

    let now = new Date();

    let h = String(now.getHours()).padStart(2,"0");
    let m = String(now.getMinutes()).padStart(2,"0");
    let s = String(now.getSeconds()).padStart(2,"0");

    document.getElementById("clock").textContent = `${h}:${m}:${s}`;

    let days =
    ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    document.getElementById("dayBox").textContent = days[now.getDay()];

    let dd = String(now.getDate()).padStart(2,"0");
    let mm = String(now.getMonth()+1).padStart(2,"0");
    let yyyy = now.getFullYear();

    document.getElementById("dateBox").textContent = `${dd}/${mm}/${yyyy}`;

    let months =
    ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

    document.getElementById("monthBox").textContent =
    `Current Month :: ${months[now.getMonth()]} ${yyyy}`;

}

updateClock();
setInterval(updateClock, 1000);

/* live session uptime ticker */

let uptimeSeconds = 0;

function updateUptime(){

    uptimeSeconds++;

    let h = String(Math.floor(uptimeSeconds/3600)).padStart(2,"0");
    let m = String(Math.floor((uptimeSeconds%3600)/60)).padStart(2,"0");
    let s = String(uptimeSeconds%60).padStart(2,"0");

    let box = document.getElementById("uptime");
    if(box){
        box.textContent = `${h}:${m}:${s}`;
    }
}

setInterval(updateUptime, 1000);

/* show logged in user if saved at login time */

let savedUser =
localStorage.getItem("loggedInUser") ||
sessionStorage.getItem("loggedInUser");

if(savedUser){
    document.getElementById("userName").textContent = savedUser;
}

</script>

</body>
</html>
