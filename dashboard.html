<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Software Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
}

body{

    font-family:'Poppins',sans-serif;

    display:flex;

    flex-direction:column;

    min-height:100vh;

    color:#1e293b;

    background:#eef4ff;
}

/* ================= TITLE BAR (very first line) ================= */

.title-bar{

    width:100%;

    background:#ffffff;

    color:#0f172a;

    text-align:center;

    padding:3px 10px;

    font-size:12px;

    font-weight:600;

    letter-spacing:0.5px;

    border-bottom:1px solid #e2e8f0;

    line-height:1.4;
}

/* ================= INFO BAR (clock / date / day / logout) ================= */

.info-bar{

    width:100%;

    background:#0f172a;

    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:14px;

    padding:3px 15px;

    font-size:11px;

    color:#93c5fd;

    flex-wrap:wrap;

    line-height:1.4;
}

.info-bar .logout-btn{

    background:linear-gradient(135deg,#ef4444,#b91c1c);

    border:none;

    color:white;

    padding:2px 10px;

    border-radius:5px;

    cursor:pointer;

    font-weight:600;

    font-size:11px;

    transition:0.3s;
}

.info-bar .logout-btn:hover{

    transform:translateY(-2px);
}

/* ================= TOOLBAR (icon buttons row, the "8 buttons") ================= */

.toolbar{

    width:100%;

    background:linear-gradient(180deg,#7dd3fc,#38bdf8);

    display:flex;

    flex-wrap:wrap;

    padding:10px 15px;

    gap:6px;

}

.tool-btn{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    width:95px;

    background:transparent;

    border:none;

    cursor:pointer;

    padding:6px 4px;

    border-radius:8px;

    transition:0.2s;

}

.tool-btn:hover{

    background:rgba(255,255,255,0.35);
}

.tool-btn .dot{

    width:26px;

    height:26px;

    border-radius:50%;

    background:#0f172a;

    margin-bottom:6px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:13px;

}

.tool-btn span.label{

    font-size:11px;

    font-weight:600;

    color:#0f172a;

    text-align:center;

    line-height:1.2;
}

/* ================= BLANK CANVAS (fully empty middle area) ================= */

.canvas{

    flex:1;

    width:100%;

    background:linear-gradient(180deg,#dbeafe,#eef4ff 40%,#f8fafc);

    display:flex;

    align-items:flex-end;

    justify-content:center;

    padding-bottom:60px;

}

.brand-name{

    font-size:34px;

    font-weight:700;

    color:#1d4ed8;

    text-align:center;

    letter-spacing:0.5px;
}

/* ================= STATUS BAR (bottom) ================= */

.status-bar{

    width:100%;

    background:linear-gradient(180deg,#38bdf8,#7dd3fc);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:8px 20px;

    font-size:13px;

    flex-wrap:wrap;

    gap:8px;

}

.status-bar .month{

    color:#b91c1c;

    font-weight:700;

}

.status-bar .welcome{

    color:#0f172a;

    font-weight:600;

}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .tool-btn{

        width:80px;
    }

    .brand-name{

        font-size:22px;
    }

}

</style>
</head>

<body>

<!-- TITLE BAR -->

<div class="title-bar">
    Prime E.M.S 1.0.0(a)
</div>

<!-- INFO BAR: clock, date, day, logout -->

<div class="info-bar">

    <span id="clock"></span>

    <span id="dateBox"></span>

    <span id="dayBox"></span>

    <button class="logout-btn" onclick="go('login.html')">
        Logout
    </button>

</div>

<!-- TOOLBAR: 8 icon buttons -->

<div class="toolbar">

    <button class="tool-btn" onclick="go('employeedashboard.html')">
        <span class="dot">🧑🏻‍💼</span>
        <span class="label">Employee<br>Management</span>
    </button>

    <button class="tool-btn" onclick="go('interview_detail.html')">
        <span class="dot">👨🏻‍💼</span>
        <span class="label">Candidate<br>Management</span>
    </button>

    <button class="tool-btn" onclick="go('uniform.html')">
        <span class="dot">👔</span>
        <span class="label">Uniform<br>Management</span>
    </button>

    <button class="tool-btn" onclick="go('attendance.html')">
        <span class="dot">📅</span>
        <span class="label">Attendance</span>
    </button>

    <button class="tool-btn" onclick="go('data.html')">
        <span class="dot">📁</span>
        <span class="label">Document<br>Center</span>
    </button>

    <button class="tool-btn" onclick="go('settingdashboard.html')">
        <span class="dot">⚙️</span>
        <span class="label">Settings</span>
    </button>

    <button class="tool-btn" onclick="go('notif.html')">
        <span class="dot">🔔</span>
        <span class="label">Notification</span>
    </button>

    <button class="tool-btn" onclick="go('error.html')">
        <span class="dot">🛠️</span>
        <span class="label">Technical<br>Support</span>
    </button>

</div>

<!-- BLANK CANVAS -->

<div class="canvas">

    <div class="brand-name">
    </div>

</div>

<!-- STATUS BAR -->

<div class="status-bar">

    <span class="month" id="monthBox"></span>

    <span class="welcome">
        Welcome : <b id="userName">ADMIN</b>
    </span>

</div>

<script>

function go(page){

    window.location.href = page;
}

/* live clock / date / day */

function updateClock(){

    let now = new Date();

    let h = String(now.getHours()).padStart(2,"0");
    let m = String(now.getMinutes()).padStart(2,"0");
    let s = String(now.getSeconds()).padStart(2,"0");

    document.getElementById("clock").textContent = `${h}:${m}:${s}`;

    let days =
    ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    document.getElementById("dayBox").textContent = days[now.getDay()];

    let dd = String(now.getDate()).padStart(2,"0");
    let mm = String(now.getMonth()+1).padStart(2,"0");
    let yyyy = now.getFullYear();

    document.getElementById("dateBox").textContent = `${dd}/${mm}/${yyyy}`;

    let months =
    ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

    document.getElementById("monthBox").textContent =
    `Current Month :: ${months[now.getMonth()]} ${yyyy}`;

}

updateClock();

setInterval(updateClock, 1000);

/* show logged in user if saved at login time */

let savedUser =
localStorage.getItem("loggedInUser") ||
sessionStorage.getItem("loggedInUser");

if(savedUser){

    document.getElementById("userName").textContent = savedUser;

}

</script>

</body>
</html>
