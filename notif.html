<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notification Center</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#f1f5f9;
    min-height:100vh;
}

/* HEADER */

.header{
    background:#1e293b;
    color:white;
    padding:15px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    flex-wrap:wrap;
    gap:10px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.header button{
    background:#38bdf8;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* CONTAINER */

.container{
    padding:20px;
}

/* PERMISSION BANNER */

.perm-banner{
    background:#fef3c7;
    border:1px solid #f59e0b;
    color:#78350f;
    padding:14px 18px;
    border-radius:12px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
}

.perm-banner.granted{
    background:#dcfce7;
    border-color:#22c55e;
    color:#14532d;
}

.perm-banner.denied{
    background:#fee2e2;
    border-color:#ef4444;
    color:#7f1d1d;
}

.perm-banner button{
    background:#1e293b;
    color:white;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    white-space:nowrap;
}

.perm-note{
    font-size:12px;
    color:#64748b;
    margin-top:-12px;
    margin-bottom:20px;
}

/* FORM */

.form-box{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);

    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:inherit;
}

textarea{
    resize:none;
    height:120px;
}

/* BUTTON */

.btn-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:15px;
}

.send-btn{
    background:#1e293b;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.send-btn:hover{
    background:#38bdf8;
    color:black;
}

.test-btn{
    background:white;
    color:#1e293b;
    border:2px solid #1e293b;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.test-btn:hover{
    background:#f1f5f9;
}

/* NOTIFICATION LIST */

.notification-box{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.notification-item{
    background:#eff6ff;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    border-left:5px solid #2563eb;

    animation:fadeIn 0.4s ease;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
}

.notification-item.delivered{
    border-left-color:#16a34a;
    background:#f0fdf4;
}

.notification-item.missed{
    border-left-color:#ef4444;
    background:#fef2f2;
}

.notification-item h3{
    margin-bottom:5px;
    color:#1e293b;
}

.notification-item p{
    color:#475569;
    margin-bottom:5px;
}

.time{
    font-size:12px;
    color:#64748b;
}

.status-tag{
    font-size:11px;
    font-weight:bold;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    background:#dbeafe;
    color:#1d4ed8;
    white-space:nowrap;
}

.status-tag.delivered{ background:#dcfce7; color:#15803d; }
.status-tag.missed{ background:#fee2e2; color:#b91c1c; }

.resend-btn{
    background:none;
    border:1px solid #cbd5e1;
    color:#334155;
    padding:5px 10px;
    border-radius:6px;
    font-size:11px;
    cursor:pointer;
    font-weight:bold;
}

.resend-btn:hover{
    border-color:#1e293b;
}

/* POPUP */

.popup{
    position:fixed;
    top:20px;
    right:20px;
    background:#1e293b;
    color:white;
    padding:15px 20px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    max-width:300px;

    display:none;

    animation:slide 0.4s ease;
}

/* ANIMATION */

@keyframes slide{
    from{
        transform:translateX(100%);
        opacity:0;
    }

    to{
        transform:translateX(0);
        opacity:1;
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .send-btn, .test-btn{
        width:100%;
    }

    .notification-item{
        flex-direction:column;
    }
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        Prime Notification Center
    </div>

    <a href="dashboard.html">
        <button>⬅ Back</button>
    </a>

</div>

<!-- CONTAINER -->

<div class="container">

    <!-- PERMISSION BANNER -->

    <div class="perm-banner" id="permBanner"></div>
    <div class="perm-note">
        ℹ️ Desktop notifications only fire while this tab is open (it can be minimized or in the background — just don't close it). Closing the tab cancels any pending reminders.
    </div>

    <!-- FORM -->

    <div class="form-box">

        <h2>Send Notification 🔔</h2>

        <br>

        <div class="form-grid">

            <input
            type="text"
            id="title"
            placeholder="Notification Title">

            <input
            type="date"
            id="ndate">

            <input
            type="time"
            id="ntime">

        </div>

        <br>

        <textarea
        id="message"
        placeholder="Enter Notification Message"></textarea>

        <div class="btn-row">
            <button class="send-btn" onclick="sendNotification()">Schedule Notification</button>
            <button class="test-btn" onclick="testNotification()">🔔 Send Test Now</button>
        </div>

    </div>

    <!-- LIST -->

    <div class="notification-box">

        <h2>Notifications 📢</h2>

        <br>

        <div id="notificationList"></div>

    </div>

</div>

<!-- POPUP -->

<div class="popup" id="popup"></div>

<script>

const STORAGE_KEY = "primeNotifications";
const armedTimers = {};

/* ---------------- PERMISSION UI ---------------- */

function renderPermBanner(){
    const banner = document.getElementById("permBanner");
    const perm = Notification.permission;

    if(perm === "granted"){
        banner.className = "perm-banner granted";
        banner.innerHTML = `<span>✅ Desktop notifications are enabled.</span>`;
    } else if(perm === "denied"){
        banner.className = "perm-banner denied";
        banner.innerHTML = `<span>🚫 Notifications are blocked for this site. Enable them from your browser's site settings to receive alerts.</span>`;
    } else {
        banner.className = "perm-banner";
        banner.innerHTML = `
            <span>🔔 Enable desktop notifications so scheduled alerts show up even when this tab isn't focused.</span>
            <button onclick="requestPermission()">Enable Notifications</button>
        `;
    }
}

function requestPermission(){
    Notification.requestPermission().then(() => renderPermBanner());
}

/* ---------------- SCHEDULE ---------------- */

function sendNotification(){

    let title = document.getElementById("title").value.trim();
    let message = document.getElementById("message").value.trim();
    let date = document.getElementById("ndate").value;
    let time = document.getElementById("ntime").value;

    if(title === "" || message === "" || time === ""){
        alert("Please fill in the title, message and time.");
        return;
    }

    if(date === ""){
        date = todayDateInputValue();
    }

    const target = buildTargetDate(date, time);
    const now = new Date();

    if(target - now < 0){
        alert("Please pick a future date and time.");
        return;
    }

    const notif = {
        id: "N" + now.getTime(),
        title,
        message,
        date,
        time,
        status: "pending"
    };

    saveNotification(notif);
    armTimer(notif);
    renderNotifications();

    document.getElementById("title").value = "";
    document.getElementById("message").value = "";
    document.getElementById("ntime").value = "";
    document.getElementById("ndate").value = "";

    alert("Notification scheduled ✅");
}

function testNotification(){
    if(Notification.permission !== "granted"){
        alert("Please enable notifications first using the banner above.");
        return;
    }
    fireNotification("Test Notification", "This is what your scheduled alerts will look like.");
}

/* ---------------- TIMER HANDLING ---------------- */

function buildTargetDate(dateStr, timeStr){
    const [y, m, d] = dateStr.split("-").map(Number);
    const [hh, mm] = timeStr.split(":").map(Number);
    return new Date(y, (m - 1), d, hh, mm, 0);
}

function todayDateInputValue(){
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

/* Re-registers a browser timer for one pending notification. */
function armTimer(notif){
    const target = buildTargetDate(notif.date, notif.time);
    const diff = target - new Date();

    if(diff <= 0) return;

    armedTimers[notif.id] = setTimeout(() => {
        fireNotification(notif.title, notif.message);
        markDelivered(notif.id);
    }, diff);
}

/* On page load, re-arms timers for every pending notification whose
   time is still ahead, and flags any that were missed while the tab
   was closed (so they don't just silently disappear). */
function armAllPendingTimers(){
    const data = loadAll();
    let changed = false;

    data.forEach(n => {
        if(n.status !== "pending") return;

        const target = buildTargetDate(n.date, n.time);
        const diff = target - new Date();

        if(diff > 0){
            armTimer(n);
        } else {
            n.status = "missed";
            changed = true;
        }
    });

    if(changed) saveAll(data);
}

function resendNow(id){
    const data = loadAll();
    const notif = data.find(n => n.id === id);
    if(!notif) return;

    fireNotification(notif.title, notif.message);
    markDelivered(id);
}

/* ---------------- FIRE / POPUP ---------------- */

function fireNotification(title, message){
    if(Notification.permission === "granted"){
        new Notification(title, { body: message });
    }

    const popup = document.getElementById("popup");
    popup.innerHTML = `<b>${escapeHtml(title)}</b><br>${escapeHtml(message)}`;
    popup.style.display = "block";

    setTimeout(() => {
        popup.style.display = "none";
    }, 5000);
}

/* ---------------- STORAGE ---------------- */

function loadAll(){
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
}

function saveAll(data){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function saveNotification(notif){
    const data = loadAll();
    data.unshift(notif);
    saveAll(data);
}

function markDelivered(id){
    const data = loadAll();
    const notif = data.find(n => n.id === id);
    if(notif){
        notif.status = "delivered";
        saveAll(data);
    }
    renderNotifications();
}

/* ---------------- RENDER LIST ---------------- */

function renderNotifications(){
    const data = loadAll();
    const box = document.getElementById("notificationList");

    if(data.length === 0){
        box.innerHTML = `<p>No notifications yet.</p>`;
        return;
    }

    box.innerHTML = data.map(n => `
        <div class="notification-item ${n.status}">
            <div>
                <h3>${escapeHtml(n.title)}</h3>
                <p>${escapeHtml(n.message)}</p>
                <div class="time">⏰ ${escapeHtml(n.date)} at ${escapeHtml(n.time)}</div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
                <span class="status-tag ${n.status}">${n.status}</span>
                ${n.status !== "pending" ? `<button class="resend-btn" onclick="resendNow('${n.id}')">🔁 Send Again</button>` : ""}
            </div>
        </div>
    `).join("");
}

function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
}

/* ---------------- INIT ---------------- */

document.getElementById("ndate").min = todayDateInputValue();

renderPermBanner();
armAllPendingTimers();
renderNotifications();

</script>

</body>
</html>
