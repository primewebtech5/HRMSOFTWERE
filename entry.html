<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Uniform Entry</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#0284c7);
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
    letter-spacing:1px;
}

.menu{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.menu button{
    border:none;
    background:rgba(255,255,255,0.12);
    color:white;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.menu button:hover{
    background:white;
    color:#0f172a;
    transform:translateY(-2px);
}

.active{
    background:white !important;
    color:#0f172a !important;
}

/* CONTAINER */

.container{
    padding:25px;
}

/* TOP TITLE */

.page-title{
    margin-bottom:20px;
}

.page-title h2{
    font-size:30px;
    margin-bottom:5px;
}

.page-title p{
    color:#64748b;
}

/* FORM CARD */

.form-card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

/* FORM GRID */

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
    color:#334155;
}

input,
select{
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    transition:0.3s;
    font-size:14px;
    background:#f8fafc;
}

input:focus,
select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
    background:white;
}

/* BUTTONS */

.btn-group{
    margin-top:25px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.primary-btn{
    background:#2563eb;
    color:white;
}

.primary-btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.secondary-btn{
    background:#0f172a;
    color:white;
}

.secondary-btn:hover{
    background:#1e293b;
}

/* SEARCH */

.search-box{
    background:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.06);
}

.search-box input{
    width:100%;
}

/* TABLE */

.table-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.table-wrapper{
    overflow-x:auto;
    margin-top:15px;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

th{
    background:#0f172a;
    color:white;
    padding:14px;
    font-size:14px;
}

td{
    padding:12px;
    border-bottom:1px solid #e2e8f0;
    text-align:center;
    font-size:14px;
}

tr:hover{
    background:#f8fafc;
}

/* ACTION BUTTON */

.action-btn{
    border:none;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
    margin:2px;
    font-size:12px;
    font-weight:bold;
}

.view-btn{
    background:#dbeafe;
    color:#1d4ed8;
}

.edit-btn{
    background:#fef3c7;
    color:#b45309;
}

.delete-btn{
    background:#fee2e2;
    color:#dc2626;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:1000;
    padding:15px;
}

.modal-content{
    background:white;
    max-width:500px;
    margin:60px auto;
    border-radius:20px;
    padding:25px;
    position:relative;
    animation:popup 0.3s ease;
}

@keyframes popup{
    from{
        transform:scale(0.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.close{
    position:absolute;
    right:18px;
    top:15px;
    font-size:22px;
    cursor:pointer;
    font-weight:bold;
}

/* DETAIL BOX */

.detail-row{
    background:#f8fafc;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

/* FOOTER */

.footer{
    margin-top:25px;
    background:#0f172a;
    color:#cbd5e1;
    text-align:center;
    padding:14px;
    font-size:14px;
}

/* MOBILE */

@media(max-width:768px){

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .menu{
        width:100%;
    }

    .menu a{
        flex:1;
    }

    .menu button{
        width:100%;
    }

    .container{
        padding:15px;
    }

    .btn-group{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        Prime Uniform System
    </div>

    <div class="menu">

        <a href="uniform.html">
            <button>🏠 Home</button>
        </a>

        <a href="#">
            <button class="active">📝 Entry</button>
        </a>

        <a href="stock.html">
            <button>📦 Stock</button>
        </a>

        <a href="vendor.html">
            <button>🚚 Vendor</button>
        </a>

        <a href="setting.html">
            <button>⚙ Setting</button>
        </a>

        <a href="dashboard.html">
            <button>🚪 Exit</button>
        </a>

    </div>

</div>

<!-- CONTAINER -->

<div class="container">

    <!-- TITLE -->

    <div class="page-title">

        <h2>Employee Uniform Entry</h2>

        <p>
            Manage employee uniform issue records professionally.
        </p>

    </div>

    <!-- FORM -->

    <div class="form-card">

        <div class="form-grid">

            <div class="form-group">
                <label>Company</label>

                <select id="company">

                    <option>Equity Hyundai</option>

                    <option>Entity Renault</option>

                </select>
            </div>

            <div class="form-group">

                <label>Branch</label>

                <select id="branch"></select>

            </div>

            <div class="form-group">

                <label>Department</label>

                <select id="department"></select>

            </div>

            <div class="form-group">

                <label>Employee Name</label>

                <input
                type="text"
                id="empName"
                onkeyup="loadHistory()">

            </div>

            <div class="form-group">

                <label>Joining Date</label>

                <input type="date" id="joining">

            </div>

            <div class="form-group">

                <label>Given Date</label>

                <input type="date" id="given"
                onchange="autoDueDate()">

            </div>

            <div class="form-group">

                <label>Pair</label>

                <input type="number" id="pair">

            </div>

            <div class="form-group">

                <label>Material</label>

                <select id="material"></select>

            </div>

            <div class="form-group">

                <label>Due Date</label>

                <input type="date" id="due" readonly>

            </div>

            <div class="form-group">

                <label>Remarks</label>

                <input type="text" id="remarks">

            </div>

        </div>

        <!-- BUTTON -->

        <div class="btn-group">

            <button
            class="btn primary-btn"
            onclick="addData()">

            💾 Save Entry

            </button>

            <button
            class="btn secondary-btn"
            onclick="exportExcel()">

            📥 Export Excel

            </button>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="search-box">

        <input
        type="text"
        id="search"
        placeholder="🔍 Search employee..."
        onkeyup="searchData()">

    </div>

<div class="table-card" id="historyCard" style="display:none;margin-bottom:20px;">

    <h3>📋 Previous Uniform History</h3>

    <div id="historyBody" style="margin-top:15px;"></div>

</div>
    
    <!-- TABLE -->

    <div class="table-card">

        <h3>📋 Employee Uniform Records</h3>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>SR</th>

                        <th>Employee</th>

                        <th>Company</th>

                        <th>Department</th>

                        <th>Material</th>

                        <th>Pair</th>

                        <th>Given Date</th>

                        <th>Due Date</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="tbody"></tbody>

            </table>

        </div>

    </div>

</div>

<!-- MODAL -->

<div id="modal" class="modal">

    <div class="modal-content">

        <span class="close"
        onclick="closeModal()">

        ×

        </span>

        <h2 style="margin-bottom:20px;">
            Employee Details
        </h2>

        <div id="detailBox"></div>

    </div>

</div>

<!-- FOOTER -->

<div class="footer">
    © 2026 PrimeWebTech | Uniform Management System
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyNxwv4nONHJ4vqRxNqkSDcqb70esqPB52-RVwzT5AbBunwQxct1AbiSjmvz0nllFkM/exec";

let data = [];

/* LOAD MASTER */

async function loadMaster(sheet,elementId){

    let res =
    await fetch(API_URL + "?sheet=" + sheet);

    let d = await res.json();

    let el =
    document.getElementById(elementId);

    el.innerHTML =
    `<option>Select</option>`;

    d.slice(1).forEach(i=>{

        el.innerHTML +=
        `<option>${i[0]}</option>`;
    });
}

/* AUTO DUE */

function autoDueDate(){

    if(given.value){

        let d = new Date(given.value);

        d.setFullYear(d.getFullYear()+1);

        due.value =
        d.toISOString().split("T")[0];
    }
}

/* RENDER */

async function render(){

    const res = await fetch(API_URL + "?sheet=Employee_Entry",{
    cache:"no-store"
});



const sheetData = await res.json();

    tbody.innerHTML = "";

    data = [];

    sheetData.slice(1).forEach((row,i)=>{

        let obj = {

            company:row[0],

            branch:row[1],

            department:row[2],

            empName:row[3],

            joining:row[4],

            given:row[5],

            pair:row[6],

            material:row[7],

            due:row[8],

            remarks:row[9],

            rowNumber:i+2
        };

        data.push(obj);

        tbody.innerHTML += `

        <tr>

            <td>${i+1}</td>

            <td>${obj.empName}</td>

            <td>${obj.company}</td>

            <td>${obj.department}</td>

            <td>${obj.material}</td>

            <td>${obj.pair}</td>

           <td>${formatDate(obj.given)}</td>

           <td>${formatDate(obj.due)}</td>

            <td>

                <button
                class="action-btn view-btn"
                onclick="showDetails(${i})">

                View

                </button>

               <button
class="action-btn edit-btn"
onclick="editData(${i})">

Edit

</button>

<button
class="action-btn delete-btn"
onclick="deleteData(${i})">

Delete

</button>

            </td>

        </tr>
        `;
    });
}

let editRow = null;

function editData(i){

    let d = data[i];

    editRow = d.rowNumber;

    company.value = d.company;
    branch.value = d.branch;
    department.value = d.department;
    empName.value = d.empName;
    joining.value = d.joining;
    given.value = d.given;
    pair.value = d.pair;
    material.value = d.material;
    due.value = d.due;
    remarks.value = d.remarks;

    document.querySelector(".primary-btn").innerHTML="✅ Update Entry";

}

async function deleteData(i){

    if(!confirm("Delete this Record?")) return;

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            sheet:"Employee_Entry",

            action:"delete",

            row:data[i].rowNumber

        })

    });

    alert("Deleted Successfully");

    render();

}

function formatDate(date){

    if(!date) return "";

    let d = new Date(date);

    let day = String(d.getDate()).padStart(2,"0");
    let month = String(d.getMonth()+1).padStart(2,"0");
    let year = d.getFullYear();

    return `${day}/${month}/${year}`;

}

/* SHOW DETAILS */

function showDetails(i){

    let d = data[i];

    detailBox.innerHTML = `

    <div class="detail-row">
        <b>Employee:</b> ${d.empName}
    </div>

    <div class="detail-row">
        <b>Company:</b> ${d.company}
    </div>

    <div class="detail-row">
        <b>Branch:</b> ${d.branch}
    </div>

    <div class="detail-row">
        <b>Department:</b> ${d.department}
    </div>

    <div class="detail-row">
        <b>Material:</b> ${d.material}
    </div>

    <div class="detail-row">
        <b>Pair:</b> ${d.pair}
    </div>

    <div class="detail-row">
        <b>Given Date:</b> ${d.given}
    </div>

    <div class="detail-row">
        <b>Due Date:</b> ${d.due}
    </div>

    <div class="detail-row">
        <b>Remarks:</b> ${d.remarks}
    </div>
    `;

    modal.style.display = "block";
}

/* CLOSE */

function closeModal(){

    modal.style.display = "none";
}

/* SAVE */

async function addData(){

    let obj={

        sheet:"Employee_Entry",

        company:company.value,

        branch:branch.value,

        department:department.value,

        empName:empName.value,

        joining:joining.value,

        given:given.value,

        pair:pair.value,

        material:material.value,

        due:due.value,

        remarks:remarks.value

    };

    if(editRow){

        obj.action="update";

        obj.row=editRow;

    }

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify(obj)

    });

    alert(editRow ? "Updated Successfully" : "Saved Successfully");

    editRow=null;

    document.querySelector(".primary-btn").innerHTML="💾 Save Entry";

    document.querySelectorAll("input").forEach(i=>i.value="");

    render();

}
/* SEARCH */

function searchData(){

    let val =
    search.value.toLowerCase();

    document
    .querySelectorAll("#tbody tr")
    .forEach(r=>{

        r.style.display =
        r.innerText.toLowerCase()
        .includes(val)

        ? ""

        : "none";
    });
}

/* EXPORT */

function exportExcel(){

    let csv =
    "SR,Employee,Company,Department,Material,Pair,Given,Due\n";

    data.forEach((d,i)=>{

        csv +=
        `${i+1},
        ${d.empName},
        ${d.company},
        ${d.department},
        ${d.material},
        ${d.pair},
        ${d.given},
        ${d.due}\n`;
    });

    let blob = new Blob([csv]);

    let a =
    document.createElement("a");

    a.href =
    URL.createObjectURL(blob);

    a.download =
    "Uniform_Records.csv";

    a.click();
}

/* INIT */

Promise.all([
    loadMaster("Branch_Master","branch"),
    loadMaster("Department_Master","department"),
    loadMaster("Material_Master","material")
]).then(render);

</script>

</body>
</html>
