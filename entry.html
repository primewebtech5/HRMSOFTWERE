<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniform Entry</title>

<style>

body {
    margin:0;
    font-family:Arial;
    background:#f1f5f9;
}

/* HEADER */
.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1e293b;
    padding:15px 20px;
    color:white;
    flex-wrap:wrap;
    gap:10px;
}

.logo { font-size:20px; font-weight:bold; }

.menu {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.menu button {
    background:transparent;
    border:none;
    color:white;
    padding:8px 10px;
    cursor:pointer;
}

.menu button:hover {
    background:#38bdf8;
    color:black;
}

/* CONTAINER */
.container {
    padding:15px;
}

/* FORM */
.form-grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

@media (max-width:768px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .menu{
        width:100%;
        justify-content:flex-start;
    }
}

/* INPUT */
input, select {
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

label { font-weight:bold; }

/* BUTTON */
button {
    margin:5px;
    padding:8px 12px;
    cursor:pointer;
}

/* TABLE WRAPPER */
.table-wrapper{
    width:100%;
    overflow-x:auto;
    margin-top:20px;
}

/* TABLE */
table {
    width:100%;
    min-width:700px;
    border-collapse:collapse;
    background:white;
}

th, td {
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
    font-size:14px;
}

th {
    background:#1e293b;
    color:white;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.6);
}

.modal-content {
    background:white;
    width:90%;
    max-width:400px;
    margin:80px auto;
    padding:20px;
    border-radius:10px;
}

.close {
    float:right;
    cursor:pointer;
    font-weight:bold;
}

/* MOBILE IMPROVEMENTS */
@media (max-width:500px){
    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    button{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="header">
    <div class="logo">Uniform Register</div>

    <div class="menu">
        <a href="uniform.html"><button>Home</button></a>
        <a href="#"><button>Data Entry</button></a>
        <a href="stock.html"><button>Stock</button></a>
        <a href="vendor.html"><button>Vendor</button></a>
        <a href="dashboard.html"><button>Exit</button></a>
    </div>
</div>

<div class="container">

<h2>Employee Uniform Entry</h2>

<div class="form-grid">

<div>
<label>Company</label>
<select id="company">
<option>Equity Hyundai</option>
<option>Entity Renault</option>
</select>
</div>

<div>
<label>Branch</label>
<select id="branch"></select>
</div>

<div>
<label>Department</label>
<select id="department"></select>
</div>

<div>
<label>Employee Name</label>
<input type="text" id="empName">
</div>

<div>
<label>Joining Date</label>
<input type="date" id="joining">
</div>

<div>
<label>Given Date</label>
<input type="date" id="given" onchange="autoDueDate()">
</div>

<div>
<label>Pair</label>
<input type="text" id="pair">
</div>

<div>
<label>Material</label>
<select id="material"></select>
</div>

<div>
<label>Due Date</label>
<input type="date" id="due" readonly>
</div>

<div style="grid-column:span 2;">
<label>Remarks</label>
<input type="text" id="remarks">
</div>

</div>

<button onclick="addData()">Submit</button>
<button onclick="exportExcel()">Export Excel</button>

<br><br>

<input type="text" id="search" placeholder="Search..." onkeyup="searchData()">

<div class="table-wrapper">
<table>
<thead>
<tr>
<th>SR</th>
<th>Name</th>
<th>Company</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">X</span>
        <h3>Employee Details</h3>
        <div id="detailBox"></div>
    </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyNxwv4nONHJ4vqRxNqkSDcqb70esqPB52-RVwzT5AbBunwQxct1AbiSjmvz0nllFkM/exec";

let data = [];
let editIndex = -1;

/* LOAD */
async function loadMaster(sheet, elementId){
    let res = await fetch(API_URL + "?sheet=" + sheet);
    let d = await res.json();

    let el = document.getElementById(elementId);
    el.innerHTML = `<option>Select</option>`;

    d.slice(1).forEach(i=>{
        el.innerHTML += `<option>${i[0]}</option>`;
    });
}

function autoDueDate(){
    if(given.value){
        let d = new Date(given.value);
        d.setFullYear(d.getFullYear()+1);
        due.value = d.toISOString().split('T')[0];
    }
}

async function render(){
    let res = await fetch(API_URL + "?sheet=Employee_Entry");
    let sheetData = await res.json();

    data = [];
    tbody.innerHTML = "";

    sheetData.slice(1).forEach((row,i)=>{
        let obj = {
            company:row[0],
            branch:row[1],
            department:row[2],
            empName:row[3],
            joining:row[4],
            given:row[5],
            pair:row[6],
            material:row[7],
            due:row[8],
            remarks:row[9],
            rowNumber:i+2
        };

        data.push(obj);

        tbody.innerHTML += `
        <tr>
            <td>${i+1}</td>
            <td>${obj.empName}</td>
            <td>${obj.company}</td>
            <td>${obj.given}</td>
            <td>
                <button onclick="showDetails(${i})">View</button>
                <button onclick="editData(${i})">Edit</button>
                <button onclick="deleteData(${i})">Del</button>
            </td>
        </tr>`;
    });
}

function showDetails(i){
    let d = data[i];

    detailBox.innerHTML = `
    <p><b>Name:</b> ${d.empName}</p>
    <p><b>Company:</b> ${d.company}</p>
    <p><b>Branch:</b> ${d.branch}</p>
    <p><b>Given:</b> ${d.given}</p>
    <p><b>Due:</b> ${d.due}</p>
    <p><b>Remarks:</b> ${d.remarks}</p>
    `;

    modal.style.display="block";
}

function closeModal(){
    modal.style.display="none";
}

async function addData(){

    let obj = {
        sheet:"Employee_Entry",
        company:company.value,
        branch:branch.value,
        department:department.value,
        empName:empName.value,
        joining:joining.value,
        given:given.value,
        pair:pair.value,
        material:material.value,
        due:due.value,
        remarks:remarks.value
    };

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(obj)
    });

    alert("Saved");
    render();
}

function searchData(){
    let val = search.value.toLowerCase();
    document.querySelectorAll("#tbody tr").forEach(r=>{
        r.style.display = r.innerText.toLowerCase().includes(val)?"":"none";
    });
}

function exportExcel(){
    let csv="SR,Name,Company,Date\n";
    data.forEach((d,i)=>{
        csv+=`${i+1},${d.empName},${d.company},${d.given}\n`;
    });

    let blob=new Blob([csv]);
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="uniform.csv";
    a.click();
}

loadMaster("Branch_Master","branch");
loadMaster("Department_Master","department");
loadMaster("Material_Master","material");
render();

</script>

</body>
</html>
