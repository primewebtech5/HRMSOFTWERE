<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Uniform Entry</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#0284c7);
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
    letter-spacing:1px;
}

.menu{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.menu button{
    border:none;
    background:rgba(255,255,255,0.12);
    color:white;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.menu button:hover{
    background:white;
    color:#0f172a;
    transform:translateY(-2px);
}

.active{
    background:white !important;
    color:#0f172a !important;
}

/* CONTAINER */

.container{
    padding:25px;
}

/* TOP TITLE */

.page-title{
    margin-bottom:20px;
}

.page-title h2{
    font-size:30px;
    margin-bottom:5px;
}

.page-title p{
    color:#64748b;
}

/* FORM CARD */

.form-card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

/* FORM GRID */

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
    color:#334155;
}

input,
select{
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    transition:0.3s;
    font-size:14px;
    background:#f8fafc;
}

input:focus,
select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
    background:white;
}

/* BUTTONS */

.btn-group{
    margin-top:25px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.primary-btn{
    background:#2563eb;
    color:white;
}

.primary-btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.secondary-btn{
    background:#0f172a;
    color:white;
}

.secondary-btn:hover{
    background:#1e293b;
}

/* SEARCH */

.search-box{
    background:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.06);
}

.search-box input{
    width:100%;
}

/* TABLE */

.table-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.table-wrapper{
    overflow-x:auto;
    margin-top:15px;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

th{
    background:#0f172a;
    color:white;
    padding:14px;
    font-size:14px;
}

td{
    padding:12px;
    border-bottom:1px solid #e2e8f0;
    text-align:center;
    font-size:14px;
}

tr:hover{
    background:#f8fafc;
}

/* ACTION BUTTON */

.action-btn{
    border:none;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
    margin:2px;
    font-size:12px;
    font-weight:bold;
}

.view-btn{
    background:#dbeafe;
    color:#1d4ed8;
}

.edit-btn{
    background:#fef3c7;
    color:#b45309;
}

.delete-btn{
    background:#fee2e2;
    color:#dc2626;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:1000;
    padding:15px;
}

.modal-content{
    background:white;
    max-width:500px;
    margin:60px auto;
    border-radius:20px;
    padding:25px;
    position:relative;
    animation:popup 0.3s ease;
}

@keyframes popup{
    from{
        transform:scale(0.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.close{
    position:absolute;
    right:18px;
    top:15px;
    font-size:22px;
    cursor:pointer;
    font-weight:bold;
}

/* DETAIL BOX */

.detail-row{
    background:#f8fafc;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

/* FOOTER */

.footer{
    margin-top:25px;
    background:#0f172a;
    color:#cbd5e1;
    text-align:center;
    padding:14px;
    font-size:14px;
}

/* MOBILE */

@media(max-width:768px){

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .menu{
        width:100%;
    }

    .menu a{
        flex:1;
    }

    .menu button{
        width:100%;
    }

    .container{
        padding:15px;
    }

    .btn-group{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

}

/* ================= LOADER ================= */

#loader{

    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.9);

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:99999;
}

.spinner{

    width:70px;
    height:70px;

    border:8px solid #dbeafe;
    border-top:8px solid #2563eb;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

.loader-text{

    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    color:#2563eb;
}

@keyframes spin{

    100%{

        transform:rotate(360deg);

    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        Prime Uniform System
    </div>

    <div class="menu">

        <a href="uniform.html">
            <button>🏠 Home</button>
        </a>

        <a href="#">
            <button class="active">📝 Entry</button>
        </a>

        <a href="stock.html">
            <button>📦 Stock</button>
        </a>

        <a href="vendor.html">
            <button>🚚 Vendor</button>
        </a>

        <a href="setting.html">
            <button>⚙ Setting</button>
        </a>

        <a href="dashboard.html">
            <button>🚪 Exit</button>
        </a>

    </div>

</div>

<!-- CONTAINER -->

<div class="container">

    <!-- TITLE -->

    <div class="page-title">

        <h2>Employee Uniform Entry</h2>

        <p>
            Manage employee uniform issue records professionally.
        </p>

    </div>

    <!-- FORM -->

    <div class="form-card">

        <div class="form-grid">

            <div class="form-group">
                <label>Company</label>

                <select id="company">

                    <option>Equity Motors (Rajkot) Pvt Ltd</option>

                    <option>Entity Motors Pvt Ltd</option>

                </select>
            </div>

            <div class="form-group">

                <label>Branch</label>

                <select id="branch"></select>

            </div>

            <div class="form-group">

                <label>Department</label>

                <select id="department"></select>

            </div>

            <div class="form-group">

                <label>Employee Name</label>

                <input
                type="text"
                id="empName">

            </div>

            <div class="form-group">

                <label>Joining Date</label>

                <input type="date" id="joining">

            </div>

            <div class="form-group">

                <label>Given Date</label>

                <input type="date" id="given"
                onchange="autoDueDate()">

            </div>

            <div class="form-group">

                <label>Pair</label>

                <input type="number" id="pair">

            </div>

            <div class="form-group">

                <label>Material</label>

                <select id="material"></select>

            </div>

            <div class="form-group">

                <label>Due Date</label>

                <input type="date" id="due" readonly>

            </div>

            <div class="form-group">

                <label>Remarks</label>

                <input type="text" id="remarks">

            </div>

            <div class="form-group">

                <label>Next Uniform Date</label>

                <input type="date" id="nextDate">

            </div>

            <div class="form-group">

                <label>Shirt (Qty)</label>

                <input type="number" id="shirt" placeholder="How many shirts">

            </div>

            <div class="form-group">

                <label>Pant (Qty)</label>

                <input type="number" id="pant" placeholder="How many pants">

            </div>

            <div class="form-group">

                <label>Price of Pair</label>

                <input type="number" id="pricePerPair" placeholder="Price per pair">

            </div>



        </div>

        <!-- BUTTON -->

        <div class="btn-group">

<button
class="btn primary-btn"
id="saveBtn"
onclick="saveOrUpdate()">
💾 Save Entry
</button>
            <button
            class="btn secondary-btn"
            onclick="exportExcel()">

            📥 Export Excel

            </button>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="search-box">

        <input
        type="text"
        id="search"
        placeholder="🔍 Search employee..."
        onkeyup="searchData()">

    </div>


    
    <!-- TABLE -->

    <div class="table-card">

        <h3>📋 Employee Uniform Records</h3>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>SR</th>

                        <th>Employee</th>

                        <th>Company</th>

                        <th>Department</th>

                        <th>Material</th>

                        <th>Pair</th>

                        <th>Given Date</th>

                        <th>Due Date</th>

                        <th>Next Uniform</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="tbody"></tbody>

            </table>

        </div>

    </div>

</div>

<!-- MODAL -->

<div id="modal" class="modal">

    <div class="modal-content">

        <span class="close"
        onclick="closeModal()">

        ×

        </span>

        <h2 style="margin-bottom:20px;">
            Employee Details
        </h2>

        <div id="detailBox"></div>

    </div>

</div>

<!-- LOADER -->

<div id="loader">

    <div class="spinner"></div>

    <div class="loader-text">
        Please Wait...
    </div>

</div>

<!-- FOOTER -->

<div class="footer">
    © 2026 PrimeWebTech | Uniform Management System
</div>

<script>

function showLoader(){

    const el = document.getElementById("loader");
    if(el) el.style.display = "flex";

}

function hideLoader(){

    const el = document.getElementById("loader");
    if(el) el.style.display = "none";

}    

const API_URL =
"https://script.google.com/macros/s/AKfycbx_k3-Eb1N5e6P8fu1NgQgaCqwRkVhkiAWjkrLkJiSZtOoq724Sb6VkB4UCHJabXI2ndw/exec";

let data = [];
let allRows = [];

/* ============================================================
   SPEED FIX
   ------------------------------------------------------------
   OLD FLOW: page load kartu 4 ALAG Google Apps Script calls —
   Branch_Master, Department_Master, Material_Master, ane
   Employee_Entry — badha separate round-trips. Ek call j
   1-2 second (kayi vaar vadhu) le chhe, etle 4 calls = slow.

   NEW FLOW: page load par FAKT EK j call (?action=entryPage) —
   backend thi branch+department+material+entry badhu ek sathe
   male chhe. Add/Edit/Delete pachi refresh mate hajuye fakt
   Employee_Entry j mangavay chhe (masters vaaramvaar mangva ni
   jarur nathi, te badalta nathi).
   ============================================================ */

function fillSelect(elementId, rows){

    let el = document.getElementById(elementId);

    let html = "<option>Select</option>";

    for(let i=1;i<rows.length;i++){
        if(rows[i][0] !== "" && rows[i][0] != null){
            html += `<option>${rows[i][0]}</option>`;
        }
    }

    el.innerHTML = html;
}

async function initPage(){

    showLoader();

    try{

        let res = await fetch(API_URL + "?action=entryPage",{cache:"no-store"});
        let json = await res.json();

        if(json && json.error){
            console.error("Backend error:", json.message);
            alert("Backend ma error aavi: " + json.message);
            return;
        }

        fillSelect("branch", json.branch || []);
        fillSelect("department", json.department || []);
        fillSelect("material", json.material || []);

        renderTable(json.entry || []);

    } catch(err){

        console.error("initPage failed:",err);
        alert("Data load karva ma problem aavi, page refresh kari jovo.");

    } finally {
        hideLoader();
    }
}

/* Kept for backward-compat, not used on init anymore */
async function loadMaster(sheet,elementId){
    let res = await fetch(API_URL + "?sheet=" + sheet);
    let d = await res.json();
    fillSelect(elementId, d);
}

/* AUTO DUE */

function autoDueDate(){

    if(!given.value) return;

    let d = new Date(given.value + "T00:00:00");

    d.setFullYear(d.getFullYear()+1);

    let y = d.getFullYear();
    let m = String(d.getMonth()+1).padStart(2,"0");
    let day = String(d.getDate()).padStart(2,"0");

    due.value = `${y}-${m}-${day}`;
}

/* RENDER (re-fetches only Employee_Entry — used after save/delete) */

async function render(){

    const res = await fetch(API_URL + "?sheet=Employee_Entry",{
        cache:"no-store"
    });

    const sheetData = await res.json();

    renderTable(sheetData);
}

/* RENDER TABLE — builds rows into an array and sets innerHTML ONCE
   (instead of tbody.innerHTML += "..." inside the loop, which
   re-parses the whole table on every single row and gets slow
   as records grow). */

function renderTable(sheetData){

    allRows = sheetData;

    data = [];

    let rowsHtml = [];

    for(let i=1;i<sheetData.length;i++){

        let row = sheetData[i];

        let obj = {
            company:row[0],
            branch:row[1],
            department:row[2],
            empName:row[3],
            joining:row[4],
            given:row[5],
            pair:row[6],
            material:row[7],
            due:row[8],
            remarks:row[9],
            nextDate:row[10],
            shirt:row[11],
            pant:row[12],
            pricePerPair:row[13],
            rowNumber:i+1
        };

        data.push(obj);

        let idx = i-1;

        let lastNext = String(obj.nextDate || "").split(",").pop().trim();

        rowsHtml.push(`
        <tr>
            <td>${idx+1}</td>
            <td>${obj.empName}</td>
            <td>${obj.company}</td>
            <td>${obj.department}</td>
            <td>${obj.material}</td>
            <td>${obj.pair}</td>
            <td>${formatDate(obj.given)}</td>
            <td>${formatDate(obj.due)}</td>
            <td>${formatDate(lastNext)}</td>
            <td>
                <button class="action-btn view-btn" onclick="showDetails(${idx})">View</button>
                <button class="action-btn edit-btn" onclick="editData(${idx})">Edit</button>
                <button class="action-btn delete-btn" onclick="deleteData(${idx})">Delete</button>
            </td>
        </tr>
        `);
    }

    tbody.innerHTML = rowsHtml.join("");
}

let editRow = null;

function editData(i){

    let d = data[i];

    editRow = d.rowNumber;

    company.value = d.company;

    setTimeout(()=>{

        branch.value = d.branch;
        department.value = d.department;
        material.value = d.material;

    },100);

    empName.value = d.empName;

joining.value = toInputDate(d.joining);

given.value = toInputDate(d.given);

pair.value = d.pair;

due.value = toInputDate(d.due);

remarks.value = d.remarks;

nextDate.value = "";

shirt.value = d.shirt || "";

pant.value = d.pant || "";

pricePerPair.value = d.pricePerPair || "";

    document.getElementById("saveBtn").innerHTML = "✅ Update Entry";

}

async function deleteData(i){

    if(!confirm("Delete this Record?")) return;
    showLoader();

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            sheet:"Employee_Entry",

            action:"delete",

            row:data[i].rowNumber

        })

    });
await render();

hideLoader();

alert("Deleted Successfully");

}

/* ============================================================
   DATE FUNCTIONS (final)
   ------------------------------------------------------------
   Backend hamesha "yyyy-MM-dd" plain text string aape chhe,
   etle ahiya koi Date object / timezone jarur j nathi — fakt
   string split thi kaam thai jay chhe.
   ============================================================ */

function formatDate(date){

    if(!date) return "";

    let p = String(date).split("-");

    if(p.length === 3){
        let [y,m,d] = p;
        return `${d}/${m}/${y}`;
    }

    return String(date);
}

function toInputDate(date){

    if(!date) return "";

    let p = String(date).split("-");

    if(p.length === 3){
        let [y,m,d] = p;
        return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
    }

    return "";
}

function showDetails(i){

    let employee = data[i].empName;

    let historyHtml = [];
    let nextDates = new Set();

    let count = 0;

    for(let r=1;r<allRows.length;r++){

        let row = allRows[r];

        if(String(row[3]).toLowerCase() == employee.toLowerCase()){

            count++;

            if(row[10]){
                String(row[10]).split(",").forEach(dt=>{
                    dt = dt.trim();
                    if(dt) nextDates.add(dt);
                });
            }

            historyHtml.push(`
                <div class="detail-row">
                    <h3 style="color:#2563eb;margin-bottom:10px;">Uniform Issue ${count}</h3>
                    <p><b>📅 Joining Date :</b> ${formatDate(row[4])}</p>
                    <p><b>📅 Given Date :</b> ${formatDate(row[5])}</p>
                    <p><b>⏰ Due Date :</b> ${formatDate(row[8])}</p>
                    <p><b>👕 Material :</b> ${row[7]}</p>
                    <p><b>📦 Pair :</b> ${row[6]}</p>
                    <p><b>👔 Shirt :</b> ${row[11] || 0}</p>
                    <p><b>👖 Pant :</b> ${row[12] || 0}</p>
                    <p><b>💰 Price of Pair :</b> ₹${row[13] || 0}</p>
                    <p><b>📝 Remarks :</b> ${row[9]}</p>
                </div>
            `);
        }
    }

    let dropdownOptions = Array.from(nextDates)
        .sort()
        .map(d => `<option>${formatDate(d)}</option>`)
        .join("");

    detailBox.innerHTML = `

        <h2 style="margin-bottom:15px;">👤 ${employee}</h2>

        <div style="background:#dbeafe;padding:12px;border-radius:10px;margin-bottom:20px;font-weight:bold;">
            Total Uniform Issued : ${count}
        </div>

        <div style="background:#fff8dc;padding:12px;border-radius:10px;margin-bottom:20px;">
            <b>📅 Next Uniform History</b>
            <select style="width:100%;padding:10px;border-radius:8px;margin-top:10px;">
                ${dropdownOptions}
            </select>
        </div>

        ${historyHtml.join("")}
    `;

    modal.style.display = "block";

}


/* CLOSE */

function closeModal(){

    modal.style.display = "none";
}

/* SAVE / UPDATE
   ------------------------------------------------------------
   On UPDATE, the backend now APPENDS this nextDate to that row's
   existing history instead of overwriting it — so every next-date
   you enter across edits stays in the dropdown, not just the
   latest one. */

async function saveOrUpdate(){
    let isUpdate = editRow != null;
    showLoader();

    let obj={

        sheet:"Employee_Entry",

        company:company.value,

        branch:branch.value,

        department:department.value,

        empName:empName.value,

        joining:joining.value,

        given:given.value,

        pair:pair.value,

        material:material.value,

        due:due.value,

        remarks:remarks.value,
        
        nextDate:nextDate.value,

        shirt:shirt.value,

        pant:pant.value,

        pricePerPair:pricePerPair.value

    };

if(isUpdate){

    obj.action = "update";
    obj.row = editRow;

}else{

    obj.action = "add";

}

   await fetch(API_URL,{

    method:"POST",

    body:JSON.stringify(obj)

});

await render();

hideLoader();

alert(isUpdate ? "Updated Successfully" : "Saved Successfully");

editRow = null;

document.getElementById("saveBtn").innerHTML = "💾 Save Entry";

document.querySelectorAll("input").forEach(i=>i.value="");

company.selectedIndex = 0;
branch.selectedIndex = 0;
department.selectedIndex = 0;
material.selectedIndex = 0;


}
/* SEARCH */

function searchData(){

    let val =
    search.value.toLowerCase();

    document
    .querySelectorAll("#tbody tr")
    .forEach(r=>{

        r.style.display =
        r.innerText.toLowerCase()
        .includes(val)

        ? ""

        : "none";
    });
}

/* EXPORT */

function exportExcel(){

    let csv =
"SR,Employee,Company,Department,Material,Pair,Shirt,Pant,Price of Pair,Given,Due,Next Uniform\n";

    data.forEach((d,i)=>{

        csv +=
        `${i+1},
        ${d.empName},
        ${d.company},
        ${d.department},
        ${d.material},
        ${d.pair},
        ${d.shirt||0},
        ${d.pant||0},
        ${d.pricePerPair||0},
        ${d.given},
        ${d.due},
        ${d.nextDate}\n`;
    });

    let blob = new Blob([csv]);

    let a =
    document.createElement("a");

    a.href =
    URL.createObjectURL(blob);

    a.download =
    "Uniform_Records.csv";

    a.click();
}

/* INIT — single combined call now, instead of 4 separate ones */

initPage();

</script>
</body>
</html>
