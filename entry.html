<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Uniform Entry</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#0284c7);
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
    letter-spacing:1px;
}

.menu{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.menu button{
    border:none;
    background:rgba(255,255,255,0.12);
    color:white;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.menu button:hover{
    background:white;
    color:#0f172a;
    transform:translateY(-2px);
}

.active{
    background:white !important;
    color:#0f172a !important;
}

/* CONTAINER */

.container{
    padding:25px;
}

/* TOP TITLE */

.page-title{
    margin-bottom:20px;
}

.page-title h2{
    font-size:30px;
    margin-bottom:5px;
}

.page-title p{
    color:#64748b;
}

/* FORM CARD */

.form-card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

/* FORM GRID */

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
    color:#334155;
}

input,
select{
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    transition:0.3s;
    font-size:14px;
    background:#f8fafc;
}

input:focus,
select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
    background:white;
}

/* BUTTONS */

.btn-group{
    margin-top:25px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.primary-btn{
    background:#2563eb;
    color:white;
}

.primary-btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.secondary-btn{
    background:#0f172a;
    color:white;
}

.secondary-btn:hover{
    background:#1e293b;
}

/* SEARCH */

.search-box{
    background:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.06);
}

.search-box input{
    width:100%;
}

/* TABLE */

.table-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.table-wrapper{
    overflow-x:auto;
    margin-top:15px;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

th{
    background:#0f172a;
    color:white;
    padding:14px;
    font-size:14px;
}

td{
    padding:12px;
    border-bottom:1px solid #e2e8f0;
    text-align:center;
    font-size:14px;
}

tr:hover{
    background:#f8fafc;
}

/* ACTION BUTTON */

.action-btn{
    border:none;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
    margin:2px;
    font-size:12px;
    font-weight:bold;
}

.view-btn{
    background:#dbeafe;
    color:#1d4ed8;
}

.edit-btn{
    background:#fef3c7;
    color:#b45309;
}

.delete-btn{
    background:#fee2e2;
    color:#dc2626;
}

/* ================= MODAL (Employee Details) — redesigned ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.6);
    z-index:1000;
    padding:15px;
}

.modal-content{
    background:white;
    max-width:560px;
    margin:40px auto;
    border-radius:22px;
    position:relative;
    animation:popup 0.3s ease;
    max-height:88vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.35);
}

@keyframes popup{
    from{
        transform:scale(0.9);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    font-size:20px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    background:rgba(255,255,255,0.15);
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    transition:0.2s;
}

.close:hover{
    background:rgba(255,255,255,0.3);
    transform:rotate(90deg);
}

/* Employee header banner inside the modal */

.emp-header{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#0284c7);
    color:white;
    padding:28px 25px 22px;
    flex-shrink:0;
}

.emp-avatar-row{
    display:flex;
    align-items:center;
    gap:14px;
}

.emp-avatar{
    width:56px;
    height:56px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    flex-shrink:0;
}

.emp-name{
    font-size:21px;
    font-weight:bold;
}

.emp-sub{
    font-size:13px;
    opacity:0.85;
    margin-top:2px;
}

.emp-stats{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:16px;
}

.stat-chip{
    background:rgba(255,255,255,0.15);
    padding:7px 13px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:600;
    backdrop-filter:blur(4px);
}

/* Scrollable body — flex:1 + min-height:0 is required so this
   child actually scrolls instead of the whole modal getting
   clipped by modal-content's overflow:hidden */

.modal-body{
    padding:22px 25px 25px;
    overflow-y:auto;
    flex:1;
    min-height:0;
}

.section-title{
    font-size:12.5px;
    font-weight:800;
    color:#64748b;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin:18px 0 10px;
}

.section-title:first-child{
    margin-top:0;
}

/* Quick-add entry form (inline inside the modal) */

.quick-add-form{
    background:#eff6ff;
    border:1px dashed #93c5fd;
    border-radius:14px;
    padding:16px;
}

.quick-add-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:10px;
    margin-bottom:14px;
}

.qa-group{
    display:flex;
    flex-direction:column;
}

.qa-group label{
    font-size:11px;
    font-weight:700;
    color:#1e3a8a;
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:0.3px;
}

.qa-group input,
.qa-group select{
    padding:9px 10px;
    border-radius:8px;
    border:1px solid #bfdbfe;
    font-size:13px;
    background:white;
}

.qa-group input:focus,
.qa-group select:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

.qa-btn{
    width:100%;
    padding:11px;
    font-size:14px;
}

/* Issue history table */

.issue-table-wrapper{
    overflow-x:auto;
    overflow-y:auto;
    max-height:260px;
    border-radius:14px;
    border:1px solid #e2e8f0;
}

.issue-table{
    width:100%;
    border-collapse:collapse;
    min-width:520px;
}

.issue-table th{
    background:#0f172a;
    color:white;
    padding:12px 10px;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.3px;
    position:sticky;
    top:0;
    z-index:2;
}

.issue-table td{
    padding:11px 10px;
    text-align:center;
    font-size:14px;
    border-bottom:1px solid #e2e8f0;
    font-weight:600;
    color:#1e293b;
}

.issue-table tr:last-child td{
    border-bottom:none;
}

.issue-table tr.overdue td{
    background:#fef2f2;
}

.issue-table tr.soon td{
    background:#fffbeb;
}

.issue-table tr:hover td{
    background:#f1f5f9;
}

.issue-table .status-cell{
    font-size:10.5px;
    font-weight:800;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.3px;
    display:inline-block;
}

.issue-table .status-cell.overdue{
    background:#dc2626;
    color:white;
}

.issue-table .status-cell.soon{
    background:#f59e0b;
    color:white;
}

.issue-table .status-cell.ok{
    background:#16a34a;
    color:white;
}

.empty-note{
    color:#94a3b8;
    font-size:13px;
    font-style:italic;
}

/* FOOTER */

.footer{
    margin-top:25px;
    background:#0f172a;
    color:#cbd5e1;
    text-align:center;
    padding:14px;
    font-size:14px;
}

/* MOBILE */

@media(max-width:768px){

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .menu{
        width:100%;
    }

    .menu a{
        flex:1;
    }

    .menu button{
        width:100%;
    }

    .container{
        padding:15px;
    }

    .btn-group{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

    .issue-grid{
        grid-template-columns:1fr;
    }

    .issue-remarks{
        grid-column:span 1;
    }

}

/* ================= LOADER ================= */

#loader{

    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.9);

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:99999;
}

.spinner{

    width:70px;
    height:70px;

    border:8px solid #dbeafe;
    border-top:8px solid #2563eb;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

.loader-text{

    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    color:#2563eb;
}

@keyframes spin{

    100%{

        transform:rotate(360deg);

    }

}

</style>
</head>

<body>

<div class="header">

    <div class="menu">

        <a href="#">

<button
class="btn primary-btn"
id="saveBtn"
onclick="saveOrUpdate()">
💾 Save Entry

<!-- MODAL -->

<div id="modal" class="modal">

        onclick="closeModal()">

        ×

        </span>

        <div id="detailBox"></div>

</div>

    <div class="spinner"></div>

        Please Wait...
    </div>

</div>

</div>

<script>

function showLoader(){

    const el = document.getElementById("loader");
    if(el) el.style.display = "flex";

}

function hideLoader(){

    const el = document.getElementById("loader");
    if(el) el.style.display = "none";

}    

const API_URL =
"https://script.google.com/macros/s/AKfycbx_k3-Eb1N5e6P8fu1NgQgaCqwRkVhkiAWjkrLkJiSZtOoq724Sb6VkB4UCHJabXI2ndw/exec";

let data = [];
let allRows = [];

/* Uniform_History rows (quick-add entries made from inside the
   Employee Details modal). Kept separate from allRows/Employee_Entry
   on purpose — these should NEVER show up as extra rows in the main
   Entry table (image 2), they should ONLY appear inside the
   employee's own "Issue History" list inside the modal. */
let historyRows = [];

/* ============================================================
   SPEED FIX
   ------------------------------------------------------------
   OLD FLOW: page load kartu 4 ALAG Google Apps Script calls —
   Branch_Master, Department_Master, Material_Master, ane
   Employee_Entry — badha separate round-trips. Ek call j
   1-2 second (kayi vaar vadhu) le chhe, etle 4 calls = slow.

   NEW FLOW: page load par FAKT EK j call (?action=entryPage) —
   backend thi branch+department+material+entry+history badhu ek
   sathe male chhe. Add/Edit/Delete pachi refresh mate hajuye fakt
   Employee_Entry j mangavay chhe (masters vaaramvaar mangva ni
   jarur nathi, te badalta nathi). Quick-add pachi fakt
   Uniform_History j re-fetch thay chhe (refreshHistory()).
   ============================================================ */

function fillSelect(elementId, rows){

    let el = document.getElementById(elementId);

    let html = "<option>Select</option>";

    for(let i=1;i<rows.length;i++){
        if(rows[i][0] !== "" && rows[i][0] != null){
            html += `<option>${rows[i][0]}</option>`;
        }
    }

    el.innerHTML = html;
}

async function initPage(){

    showLoader();

    try{

        let res = await fetch(API_URL + "?action=entryPage",{cache:"no-store"});
        let json = await res.json();

        if(json && json.error){
            console.error("Backend error:", json.message);
            alert("Backend ma error aavi: " + json.message);
            return;
        }

        fillSelect("branch", json.branch || []);
        fillSelect("department", json.department || []);
        fillSelect("material", json.material || []);

        renderTable(json.entry || []);

        historyRows = json.history || [];

    } catch(err){

        console.error("initPage failed:",err);
        alert("Data load karva ma problem aavi, page refresh kari jovo.");

    } finally {
        hideLoader();
    }
}

/* Kept for backward-compat, not used on init anymore */
async function loadMaster(sheet,elementId){
    let res = await fetch(API_URL + "?sheet=" + sheet);
    let d = await res.json();
    fillSelect(elementId, d);
}

/* AUTO DUE */

function autoDueDate(){

    if(!given.value) return;

    let d = new Date(given.value + "T00:00:00");

    d.setFullYear(d.getFullYear()+1);

    let y = d.getFullYear();
    let m = String(d.getMonth()+1).padStart(2,"0");
    let day = String(d.getDate()).padStart(2,"0");

    due.value = `${y}-${m}-${day}`;
}

/* RENDER (re-fetches only Employee_Entry — used after save/delete of
   the MAIN form. Quick-add entries never touch Employee_Entry so
   this never needs to change for that flow.) */

async function render(){

    const res = await fetch(API_URL + "?sheet=Employee_Entry",{
        cache:"no-store"
    });

    const sheetData = await res.json();

    renderTable(sheetData);
}

/* Re-fetches only Uniform_History — used after a quick-add inside
   the modal, so the new row shows up in the Issue History list
   without needing to reload the whole page or touch the main table. */

async function refreshHistory(){

    const res = await fetch(API_URL + "?sheet=Uniform_History",{
        cache:"no-store"
    });

    historyRows = await res.json();
}

/* RENDER TABLE — builds rows into an array and sets innerHTML ONCE
   (instead of tbody.innerHTML += "..." inside the loop, which
   re-parses the whole table on every single row and gets slow
   as records grow). */

function renderTable(sheetData){

    allRows = sheetData;

    data = [];

    let rowsHtml = [];

    for(let i=1;i<sheetData.length;i++){

        let row = sheetData[i];

        let obj = {
            company:row[0],
            branch:row[1],
            department:row[2],
            empName:row[3],
            joining:row[4],
            given:row[5],
            pair:row[6],
            material:row[7],
            due:row[8],
            remarks:row[9],
            nextDate:row[10],
            shirt:row[11],
            pant:row[12],
            pricePerPair:row[13],
            rowNumber:i+1
        };

        data.push(obj);

        let idx = i-1;

        let lastNext = String(obj.nextDate || "").split(",").pop().trim();

        rowsHtml.push(`
        <tr>
            <td>${idx+1}</td>
            <td>${obj.empName}</td>
            <td>${obj.company}</td>
            <td>${obj.department}</td>
            <td>${obj.material}</td>
            <td>${obj.pair}</td>
            <td>${formatDate(obj.given)}</td>
            <td>${formatDate(obj.due)}</td>
            <td>${formatDate(lastNext)}</td>
            <td>
                <button class="action-btn view-btn" onclick="showDetails(${idx})">View</button>
                <button class="action-btn edit-btn" onclick="editData(${idx})">Edit</button>
                <button class="action-btn delete-btn" onclick="deleteData(${idx})">Delete</button>
            </td>
        </tr>
        `);
    }

    tbody.innerHTML = rowsHtml.join("");
}

let editRow = null;

function editData(i){

    let d = data[i];

    editRow = d.rowNumber;

    company.value = d.company;

    setTimeout(()=>{

        branch.value = d.branch;
        department.value = d.department;
        material.value = d.material;

    },100);

    empName.value = d.empName;

joining.value = toInputDate(d.joining);

given.value = toInputDate(d.given);

pair.value = d.pair;

due.value = toInputDate(d.due);

remarks.value = d.remarks;

nextDate.value = "";

shirt.value = d.shirt || "";

pant.value = d.pant || "";

pricePerPair.value = d.pricePerPair || "";

    document.getElementById("saveBtn").innerHTML = "✅ Update Entry";

}

async function deleteData(i){

    if(!confirm("Delete this Record?")) return;
    showLoader();

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            sheet:"Employee_Entry",

            action:"delete",

            row:data[i].rowNumber

        })

    });
await render();

hideLoader();

alert("Deleted Successfully");

}

/* ============================================================
   DATE FUNCTIONS (final)
   ------------------------------------------------------------
   Backend hamesha "yyyy-MM-dd" plain text string aape chhe,
   etle ahiya koi Date object / timezone jarur j nathi — fakt
   string split thi kaam thai jay chhe.
   ============================================================ */

function formatDate(date){

    if(!date) return "";

    let p = String(date).split("-");

    if(p.length === 3){
        let [y,m,d] = p;
        return `${d}/${m}/${y}`;
    }

    return String(date);
}

function toInputDate(date){

    if(!date) return "";

    let p = String(date).split("-");

    if(p.length === 3){
        let [y,m,d] = p;
        return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
    }

    return "";
}

/* ============================================================
   EMPLOYEE DETAILS MODAL — redesigned
   ------------------------------------------------------------
   Issue History have BE sources mathi combine thay chhe:
     1) Employee_Entry ma e employee nu main/original entry(s)
     2) Uniform_History ma save thayela badha quick-add entries
   Banne ne date pramane sort kari, ek j table ma batavay chhe.
   Table potani j max-height + scroll rakhe chhe (issue-table-wrapper),
   etle list gamey tetli lambi thay to pan modal fatvano/bhagvano
   nathi — andar j scroll thay chhe ane quick-add form/stats
   hammesha upar dekhata rahe chhe.
   ============================================================ */

function getDueStatus(dueRaw, todayDate){

    if(!dueRaw) return "ok";

    let d = new Date(String(dueRaw) + "T00:00:00");
    if(isNaN(d.getTime())) return "ok";

    let diffDays = Math.floor((d - todayDate) / (1000*60*60*24));

    if(diffDays < 0) return "overdue";
    if(diffDays <= 30) return "soon";
    return "ok";
}

function showDetails(i){

    let employee = data[i].empName;
    let company = data[i].company;

    let today = new Date();
    today.setHours(0,0,0,0);

    let matches = [];

    // 1) Main entry (Employee_Entry) rows for this employee
    for(let r=1;r<allRows.length;r++){
        let row = allRows[r];
        if(String(row[3]).toLowerCase() == employee.toLowerCase()){
            matches.push({
                date: row[5],
                material: row[7],
                pair: row[6],
                shirt: row[11],
                pant: row[12],
                pricePerPair: row[13]
            });
        }
    }

    // 2) Quick-add (Uniform_History) rows for this employee
    for(let h=1;h<historyRows.length;h++){
        let row = historyRows[h];
        if(String(row[0]).toLowerCase() == employee.toLowerCase()){
            matches.push({
                date: row[1],
                material: row[2],
                pair: row[3],
                shirt: row[4],
                pant: row[5],
                pricePerPair: row[6]
            });
        }
    }

    // Oldest first, so SR 1 = the very first issue for this employee,
    // SR 2 = second issue, and so on
    matches.sort((a,b) => String(a.date||"").localeCompare(String(b.date||"")));

    let materialsUsed = new Set();
    let totalInvestment = 0;
    let count = 0;

    let tableRowsHtml = matches.map(m => {

        count++;

        if(m.material) materialsUsed.add(m.material);

        let priceVal = Number(m.pricePerPair) || 0;
        let pairVal = Number(m.pair) || 0;
        let amount = priceVal * pairVal;
        totalInvestment += amount;

        let due = calcQuickDueDate(m.date);
        let status = getDueStatus(due, today);
        let statusLabel = status === "overdue" ? "Overdue" : status === "soon" ? "Due Soon" : "OK";

        return `
            <tr class="${status}">
                <td>${count}</td>
                <td>${formatDate(m.date)}</td>
                <td>${m.pair || 0}</td>
                <td>${m.shirt || 0}</td>
                <td>${m.pant || 0}</td>
                <td>₹${amount.toLocaleString()}</td>
                <td><span class="status-cell ${status}">${statusLabel}</span></td>
            </tr>
        `;
    }).join("");

    let historyHtml = matches.length
        ? `
        <div class="issue-table-wrapper">
            <table class="issue-table">
                <thead>
                    <tr>
                        <th>SR</th>
                        <th>Date</th>
                        <th>Pair</th>
                        <th>Shirt</th>
                        <th>Pant</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRowsHtml}
                </tbody>
            </table>
        </div>
        `
        : "";

    // Remember which employee the modal is open for, so the
    // quick-add form below knows who to save the new entry against.
    currentModalEmployee = employee;

    // Reuse the same Material options already loaded into the main
    // form's dropdown, so both stay in sync automatically.
    let materialOptionsHtml = document.getElementById("material").innerHTML;

    detailBox.innerHTML = `

        <div class="emp-header">
            <div class="emp-avatar-row">
                <div class="emp-avatar">👤</div>
                <div>
                    <div class="emp-name">${employee}</div>
                    <div class="emp-sub">${company || ""}</div>
                </div>
            </div>
            <div class="emp-stats">
                <div class="stat-chip">📦 ${count} Uniform${count === 1 ? "" : "s"} Issued</div>
                <div class="stat-chip">👕 ${Array.from(materialsUsed).join(", ") || "-"}</div>
                <div class="stat-chip">💰 ₹${totalInvestment.toLocaleString()}</div>
            </div>
        </div>

        <div class="modal-body">

            <div class="section-title">➕ Add New Uniform Entry</div>

            <div class="quick-add-form">
                <div class="quick-add-grid">
                    <div class="qa-group">
                        <label>Date</label>
                        <input type="date" id="qaDate">
                    </div>
                    <div class="qa-group">
                        <label>Material</label>
                        <select id="qaMaterial">${materialOptionsHtml}</select>
                    </div>
                    <div class="qa-group">
                        <label>Pair</label>
                        <input type="number" id="qaPair" placeholder="0">
                    </div>
                    <div class="qa-group">
                        <label>Shirt</label>
                        <input type="number" id="qaShirt" placeholder="0">
                    </div>
                    <div class="qa-group">
                        <label>Pant</label>
                        <input type="number" id="qaPant" placeholder="0">
                    </div>
                    <div class="qa-group">
                        <label>Price / Pair</label>
                        <input type="number" id="qaPrice" placeholder="₹0">
                    </div>
                </div>
                <button class="btn primary-btn qa-btn" onclick="addQuickEntry()">
                    ➕ Add Entry
                </button>
            </div>

            <div class="section-title">📋 Issue History</div>
            ${historyHtml || `<div class="empty-note">No records found.</div>`}

        </div>
    `;

    modal.style.display = "block";

}

let currentModalEmployee = null;

/* QUICK ADD — saves a brand new uniform entry for the employee
   currently open in the modal, WITHOUT closing the modal, and
   WITHOUT ever touching Employee_Entry (that's the main table on
   this page — image 2 — and it must stay exactly as-is). This now
   correctly saves into the separate Uniform_History sheet, so:
     - Main Entry table (image 2) never gets extra/duplicate rows
     - The new row shows up ONLY inside this employee's modal,
       in the Issue History list below
   After saving, only Uniform_History is re-fetched (refreshHistory)
   and the modal re-opens itself with the new row included. */

function calcQuickDueDate(givenStr){

    if(!givenStr) return "";

    let d = new Date(givenStr + "T00:00:00");
    d.setFullYear(d.getFullYear()+1);

    let y = d.getFullYear();
    let m = String(d.getMonth()+1).padStart(2,"0");
    let day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;
}

async function addQuickEntry(){

    let empName = currentModalEmployee;
    if(!empName) return;

    let dateVal = document.getElementById("qaDate").value;
    let materialVal = document.getElementById("qaMaterial").value;
    let pairVal = document.getElementById("qaPair").value;
    let shirtVal = document.getElementById("qaShirt").value;
    let pantVal = document.getElementById("qaPant").value;
    let priceVal = document.getElementById("qaPrice").value;

    if(!dateVal || !pairVal){
        alert("Date ane Pair bharvu jaruri chhe.");
        return;
    }

    showLoader();

    let obj = {
        sheet:"Uniform_History",
        action:"add",
        empName: empName,
        date: dateVal,
        material: materialVal,
        pair: pairVal,
        shirt: shirtVal,
        pant: pantVal,
        pricePerPair: priceVal
    };

    try{

        const res = await fetch(API_URL, {
            method:"POST",
            body: JSON.stringify(obj)
        });

        const result = await res.json();

        if(result && (result.status === "error" || result.error)){
            alert("Save karva ma error aavi: " + (result.message || "Unknown error"));
            return;
        }

        await refreshHistory(); // refreshes ONLY Uniform_History, main table untouched

        let idx = data.findIndex(d => d.empName.toLowerCase() === empName.toLowerCase());

        if(idx !== -1){
            showDetails(idx); // re-open modal with the new row included
        }

        alert("Entry Added Successfully");

    } catch(err){

        console.error("addQuickEntry failed:", err);
        alert("Entry add karva ma problem aavi, ferithi try karo.");

    } finally {
        hideLoader();
    }
}

function closeModal(){

    modal.style.display = "none";
}

/* SAVE / UPDATE
   ------------------------------------------------------------
   On UPDATE, the backend now APPENDS this nextDate to that row's
   existing history instead of overwriting it — so every next-date
   you enter across edits stays in the dropdown, not just the
   latest one. */

async function saveOrUpdate(){
    let isUpdate = editRow != null;
    showLoader();

    let obj={

        sheet:"Employee_Entry",

        company:company.value,

        branch:branch.value,

        department:department.value,

        empName:empName.value,

        joining:joining.value,

        given:given.value,

        pair:pair.value,

        material:material.value,

        due:due.value,

        remarks:remarks.value,
        
        nextDate:nextDate.value,

        shirt:shirt.value,

        pant:pant.value,

        pricePerPair:pricePerPair.value

    };

if(isUpdate){

    obj.action = "update";
    obj.row = editRow;

}else{

    obj.action = "add";

}

   await fetch(API_URL,{

    method:"POST",

    body:JSON.stringify(obj)

});

await render();

hideLoader();

alert(isUpdate ? "Updated Successfully" : "Saved Successfully");

editRow = null;

document.getElementById("saveBtn").innerHTML = "💾 Save Entry";

document.querySelectorAll("input").forEach(i=>i.value="");

company.selectedIndex = 0;
branch.selectedIndex = 0;
department.selectedIndex = 0;
material.selectedIndex = 0;


}
/* SEARCH */

function searchData(){

    let val =
    search.value.toLowerCase();

    document
    .querySelectorAll("#tbody tr")
    .forEach(r=>{

        r.style.display =
        r.innerText.toLowerCase()
        .includes(val)

        ? ""

        : "none";
    });
}

/* EXPORT */

function exportExcel(){

    let csv =
"SR,Employee,Company,Department,Material,Pair,Shirt,Pant,Price of Pair,Given,Due,Next Uniform\n";

    data.forEach((d,i)=>{

        csv +=
        `${i+1},
        ${d.empName},
        ${d.company},
        ${d.department},
        ${d.material},
        ${d.pair},
        ${d.shirt||0},
        ${d.pant||0},
        ${d.pricePerPair||0},
        ${d.given},
        ${d.due},
        ${d.nextDate}\n`;
    });

    let blob = new Blob([csv]);

    let a =
    document.createElement("a");

    a.href =
    URL.createObjectURL(blob);

    a.download =
    "Uniform_Records.csv";

    a.click();
}
