<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Bill Entry</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f1f5f9;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1e293b;
    padding:15px 20px;
    color:white;
    flex-wrap:wrap;
    gap:10px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.menu button{
    background:transparent;
    border:none;
    color:white;
    padding:8px 10px;
    cursor:pointer;
}

.menu button:hover{
    background:#38bdf8;
    color:black;
}

/* CONTAINER */
.container{
    padding:15px;
}

/* FORM GRID */
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

@media (max-width:768px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .menu{
        width:100%;
    }
}

/* INPUT */
input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

/* BUTTON */
.btn{
    background:#1e293b;
    color:white;
    border:none;
    padding:10px 12px;
    cursor:pointer;
    margin:5px 0;
    border-radius:6px;
}

.btn:hover{
    background:#38bdf8;
    color:black;
}

/* TOTAL BOX */
.total-box{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    width:100%;
    max-width:250px;
}

/* IMAGE */
.preview{
    margin-top:10px;
    max-width:120px;
    border-radius:6px;
}

/* TABLE WRAPPER */
.table-wrapper{
    width:100%;
    overflow-x:auto;
    margin-top:20px;
}

/* TABLE */
table{
    width:100%;
    min-width:800px;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
    font-size:14px;
}

th{
    background:#1e293b;
    color:white;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    justify-content:center;
    align-items:center;
}

.modal img{
    max-width:90%;
    max-height:90%;
}

/* MOBILE */
@media (max-width:500px){
    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .btn{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="header">
    <div class="logo">Vendor Register</div>

    <div class="menu">
        <a href="uniform.html"><button>Home</button></a>
        <a href="entry.html"><button>Data Entry</button></a>
        <a href="stock.html"><button>Stock</button></a>
        <a href="#"><button>Vendor</button></a>
        <a href="dashboard.html"><button>Exit</button></a>
    </div>
</div>

<div class="container">

<h2>Vendor Bill Entry</h2>

<div class="form-grid">

<input type="text" id="vendor" placeholder="Vendor Name">
<input type="date" id="date">

<input type="text" id="product" placeholder="Product Name">
<input type="number" id="qty" placeholder="Quantity">

<input type="number" id="rate" placeholder="Rate">

</div>

<br>

<input type="file" onchange="uploadImage(event)">
<br>
<img id="preview" class="preview">

<div class="total-box">
<h3>Total: ₹ <span id="total">0</span></h3>
</div>

<button class="btn" onclick="calculate()">Calculate</button>
<button class="btn" onclick="saveBill()">Save</button>
<button class="btn" onclick="exportExcel()">Excel</button>

<br><br>

<input type="text" id="search" placeholder="Search..." onkeyup="searchData()">

<div class="table-wrapper">

<table>
<thead>
<tr>
<th>Vendor</th>
<th>Date</th>
<th>Product</th>
<th>Qty</th>
<th>Rate</th>
<th>Total</th>
<th>Image</th>
<th>Action</th>
</tr>
</thead>

<tbody id="tableData"></tbody>

</table>

</div>

</div>

<!-- MODAL -->
<div class="modal" id="imgModal" onclick="closeModal()">
<img id="bigImg">
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwlk8Zfu0j3KvhB5eKF1dkbOPfQWaS4qr7aV_VG4qQaIUXWvovPOXo1A7IajMYDUgz8Vg/exec";

let imageData = "";
let editRow = null;

/* CALCULATE */
function calculate(){
    let qty = Number(qty.value || 0);
    let rate = Number(rate.value || 0);
    total.innerText = qty * rate;
}

/* IMAGE */
function uploadImage(e){
    let file = e.target.files[0];
    let reader = new FileReader();

    reader.onload = function(){
        imageData = reader.result;
        preview.src = imageData;
    }

    if(file) reader.readAsDataURL(file);
}

/* SAVE */
async function saveBill(){

    let obj = {
        sheet:"Vendor_Bills",
        vendor:vendor.value,
        date:date.value,
        product:product.value,
        qty:qty.value,
        rate:rate.value,
        total:total.innerText,
        image:imageData
    };

    if(editRow){
        obj.action="update";
        obj.row=editRow;
    }

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(obj)
    });

    alert("Saved");
    clearForm();
    loadTable();
}

/* LOAD */
async function loadTable(){

    let res = await fetch(API_URL + "?sheet=Vendor_Bills");
    let data = await res.json();

    tableData.innerHTML="";

    data.slice(1).forEach((d,i)=>{

        tableData.innerHTML += `
        <tr>
            <td>${d[0]}</td>
            <td>${d[1]}</td>
            <td>${d[2]}</td>
            <td>${d[3]}</td>
            <td>${d[4]}</td>
            <td>${d[5]}</td>
            <td>
                ${d[6] ? `<img src="${d[6]}" width="50" onclick="showImage('${d[6]}')">` : "No"}
            </td>
            <td>
                <button onclick="deleteData(${i+2})">Del</button>
            </td>
        </tr>`;
    });
}

/* DELETE */
async function deleteData(row){
    if(confirm("Delete?")){
        await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify({
                sheet:"Vendor_Bills",
                action:"delete",
                row:row
            })
        });
        loadTable();
    }
}

/* SEARCH */
function searchData(){
    let val = search.value.toLowerCase();

    document.querySelectorAll("#tableData tr").forEach(r=>{
        r.style.display = r.innerText.toLowerCase().includes(val)?"":"none";
    });
}

/* CLEAR */
function clearForm(){
    vendor.value="";
    date.value="";
    product.value="";
    qty.value="";
    rate.value="";
    total.innerText="0";
    preview.src="";
    imageData="";
    editRow=null;
}

/* IMAGE */
function showImage(src){
    imgModal.style.display="flex";
    bigImg.src=src;
}

function closeModal(){
    imgModal.style.display="none";
}

/* INIT */
loadTable();

</script>

</body>
</html>
