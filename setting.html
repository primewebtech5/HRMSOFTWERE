<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setting</title>

<style>
body { margin:0; font-family:Arial; background:#f1f5f9; }

/* HEADER SAME AS STOCK */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e293b;
    padding: 15px 30px;
    color: white;
}

.logo { font-size: 22px; font-weight: bold; }

.menu { display: flex; gap: 20px; }

.menu button {
    background: transparent;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 6px;
}

.menu button:hover {
    background: #38bdf8;
    color: black;
}

.active {
    background:#38bdf8 !important;
    color:black !important;
}

/* CONTENT */
.container{
    padding:20px;
    display:flex;
    gap:30px;
    flex-wrap:wrap;
}

/* BOX */
.box{
    background:white;
    padding:20px;
    border-radius:10px;
    width:300px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:8px;
    margin-bottom:10px;
}

button{
    padding:6px 10px;
    margin:5px 0;
    cursor:pointer;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}

th{
    background:#1e293b;
    color:white;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">Uniform Register</div>

    <div class="menu">
        <a href="uniform.html"><button>Home</button></a>
        <a href="entry.html"><button>Data Entry</button></a>
        <a href="stock.html"><button>Stock Management</button></a>
        <a href="vendor.html"><button>Vendor Management</button></a>
        <a href="#"><button class="active">Setting</button></a>
        <a href="dashboard.html"><button>Exit</button></a>
    </div>
</div>

<div class="container">

<!-- BRANCH -->
<div class="box">
<h3>Branch Master</h3>

<input type="text" id="branchName" placeholder="Enter Branch">
<button onclick="addBranch()">Add</button>

<table>
<thead>
<tr><th>Branch</th><th>Action</th></tr>
</thead>
<tbody id="branchTable"></tbody>
</table>
</div>

<!-- DEPARTMENT -->
<div class="box">
<h3>Department Master</h3>

<input type="text" id="deptName" placeholder="Enter Department">
<button onclick="addDept()">Add</button>

<table>
<thead>
<tr><th>Department</th><th>Action</th></tr>
</thead>
<tbody id="deptTable"></tbody>
</table>
</div>

<!-- MATERIAL MASTER -->
<div class="box">
<h3>Uniform Material Master</h3>

<input type="text" id="matName" placeholder="Enter Material">
<button onclick="addMaterial()">Add</button>

<table>
<thead>
<tr><th>Material</th><th>Action</th></tr>
</thead>
<tbody id="matTable"></tbody>
</table>
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyNxwv4nONHJ4vqRxNqkSDcqb70esqPB52-RVwzT5AbBunwQxct1AbiSjmvz0nllFkM/exec";

let editType = "";
let editRow = "";

/* ================= BRANCH ================= */

async function addBranch(){

    if(branchName.value=="") return;

    let obj = {
        sheet:"Branch_Master",
        branch:branchName.value
    };

    if(editType=="Branch_Master"){

        obj.action = "update";

        obj.row = editRow;
    }

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(obj)
    });

    branchName.value="";

    editType="";

    loadBranch();
}

async function loadBranch(){

    let res = await fetch(API_URL + "?sheet=Branch_Master");

    let data = await res.json();

    branchTable.innerHTML="";

    data.slice(1).forEach((b,i)=>{

        branchTable.innerHTML += `
        <tr>

            <td>${b[0]}</td>

            <td>

                <button onclick="editBranch(${i+2},'${b[0]}')">
                Update
                </button>

                <button onclick="deleteData('Branch_Master',${i+2})">
                Delete
                </button>

            </td>

        </tr>`;
    });
}

/* ================= DEPARTMENT ================= */

async function addDept(){

    if(deptName.value=="") return;

    let obj = {
        sheet:"Department_Master",
        department:deptName.value
    };

    if(editType=="Department_Master"){

        obj.action = "update";

        obj.row = editRow;
    }

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(obj)
    });

    deptName.value="";

    editType="";

    loadDept();
}

async function loadDept(){

    let res = await fetch(API_URL + "?sheet=Department_Master");

    let data = await res.json();

    deptTable.innerHTML="";

    data.slice(1).forEach((d,i)=>{

        deptTable.innerHTML += `
        <tr>

            <td>${d[0]}</td>

            <td>

                <button onclick="editDept(${i+2},'${d[0]}')">
                Update
                </button>

                <button onclick="deleteData('Department_Master',${i+2})">
                Delete
                </button>

            </td>

        </tr>`;
    });
}

/* ================= MATERIAL ================= */

async function addMaterial(){

    if(matName.value=="") return;

    let obj = {
        sheet:"Material_Master",
        material:matName.value
    };

    if(editType=="Material_Master"){

        obj.action = "update";

        obj.row = editRow;
    }

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(obj)
    });

    matName.value="";

    editType="";

    loadMaterial();
}

async function loadMaterial(){

    let res = await fetch(API_URL + "?sheet=Material_Master");

    let data = await res.json();

    matTable.innerHTML="";

    data.slice(1).forEach((m,i)=>{

        matTable.innerHTML += `
        <tr>

            <td>${m[0]}</td>

            <td>

                <button onclick="editMaterial(${i+2},'${m[0]}')">
                Update
                </button>

                <button onclick="deleteData('Material_Master',${i+2})">
                Delete
                </button>

            </td>

        </tr>`;
    });
}

/* ================= EDIT ================= */

function editBranch(row,name){

    branchName.value = name;

    editType = "Branch_Master";

    editRow = row;
}

function editDept(row,name){

    deptName.value = name;

    editType = "Department_Master";

    editRow = row;
}

function editMaterial(row,name){

    matName.value = name;

    editType = "Material_Master";

    editRow = row;
}

/* ================= DELETE ================= */

async function deleteData(sheet,row){

    if(confirm("Delete Data?")){

        await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify({
                sheet:sheet,
                action:"delete",
                row:row
            })
        });

        loadBranch();

        loadDept();

        loadMaterial();
    }
}

/* ================= INIT ================= */

loadBranch();

loadDept();

loadMaterial();

</script>

</body>
</html>
