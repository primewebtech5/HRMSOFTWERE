<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Setting</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:
    linear-gradient(
    135deg,
    #dbeafe,
    #f8fafc,
    #e0f2fe
    );
    min-height:100vh;
}

/* HEADER */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:
    linear-gradient(
    90deg,
    #0f172a,
    #1e293b
    );

    padding:18px 30px;

    color:white;

    flex-wrap:wrap;

    gap:15px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.2);
}

.logo{

    font-size:24px;

    font-weight:bold;

    letter-spacing:1px;
}

.menu{

    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.menu button{

    background:transparent;

    border:none;

    color:white;

    font-size:15px;

    cursor:pointer;

    padding:10px 16px;

    border-radius:10px;

    transition:0.3s;

    font-weight:bold;
}

.menu button:hover{

    background:#38bdf8;

    color:#000;

    transform:translateY(-2px);
}

.active{

    background:#38bdf8 !important;

    color:black !important;

    box-shadow:
    0 4px 10px rgba(56,189,248,0.4);
}

/* CONTENT */

.container{

    padding:25px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

    gap:25px;
}

/* BOX */

.box{

    background:
    rgba(255,255,255,0.7);

    backdrop-filter:blur(10px);

    padding:22px;

    border-radius:20px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.08);

    transition:0.3s;

    border:1px solid rgba(255,255,255,0.5);
}

.box:hover{

    transform:translateY(-5px);

    box-shadow:
    0 15px 35px rgba(0,0,0,0.12);
}

.box h3{

    margin-bottom:18px;

    color:#0f172a;

    font-size:20px;
}

/* INPUT */

input{

    width:100%;

    padding:13px;

    margin-bottom:12px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    outline:none;

    font-size:14px;

    background:white;

    transition:0.3s;
}

input:focus{

    border-color:#38bdf8;

    box-shadow:
    0 0 10px rgba(56,189,248,0.4);
}

/* BUTTON */

button{

    padding:10px 14px;

    margin:4px;

    cursor:pointer;

    border:none;

    border-radius:10px;

    transition:0.3s;

    font-weight:bold;
}

/* ADD BUTTON */

.add-btn{

    background:
    linear-gradient(
    90deg,
    #0f172a,
    #1e293b
    );

    color:white;

    width:100%;
}

.add-btn:hover{

    background:
    linear-gradient(
    90deg,
    #38bdf8,
    #0ea5e9
    );

    color:black;

    transform:scale(1.02);
}

/* UPDATE BUTTON */

.update-btn{

    background:#2563eb;

    color:white;
}

.update-btn:hover{

    background:#1d4ed8;

    transform:scale(1.05);
}

/* DELETE BUTTON */

.delete-btn{

    background:#ef4444;

    color:white;
}

.delete-btn:hover{

    background:#dc2626;

    transform:scale(1.05);
}

/* TABLE */

.table-wrapper{

    overflow-x:auto;

    margin-top:15px;
}

table{

    width:100%;

    border-collapse:collapse;

    overflow:hidden;

    border-radius:12px;
}

th{

    background:
    linear-gradient(
    90deg,
    #0f172a,
    #1e293b
    );

    color:white;

    padding:12px;

    font-size:14px;
}

td{

    background:white;

    padding:12px;

    text-align:center;

    border-bottom:1px solid #e2e8f0;

    font-size:14px;
}

tr:hover td{

    background:#f0f9ff;
}

/* MOBILE */

@media(max-width:768px){

    .header{

        flex-direction:column;

        align-items:flex-start;
    }

    .menu{

        width:100%;
    }

    .menu a{

        flex:1;
    }

    .menu button{

        width:100%;
    }

    .container{

        padding:15px;
    }

    .logo{

        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="header">

    <div class="logo">
    Uniform Register
    </div>

    <div class="menu">

        <a href="uniform.html">
        <button>Home</button>
        </a>

        <a href="entry.html">
        <button>Data Entry</button>
        </a>

        <a href="stock.html">
        <button>Stock Management</button>
        </a>

        <a href="vendor.html">
        <button>Vendor Management</button>
        </a>

        <a href="#">
        <button class="active">
        Setting
        </button>
        </a>

        <a href="dashboard.html">
        <button>Exit</button>
        </a>

    </div>

</div>

<div class="container">

<!-- BRANCH -->

<div class="box">

<h3>Branch Master</h3>

<input
type="text"
id="branchName"
placeholder="Enter Branch">

<button
class="add-btn"
onclick="addBranch()">

Add Branch

</button>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Branch</th>

<th>Action</th>

</tr>

</thead>

<tbody id="branchTable"></tbody>

</table>

</div>

</div>

<!-- DEPARTMENT -->

<div class="box">

<h3>Department Master</h3>

<input
type="text"
id="deptName"
placeholder="Enter Department">

<button
class="add-btn"
onclick="addDept()">

Add Department

</button>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Department</th>

<th>Action</th>

</tr>

</thead>

<tbody id="deptTable"></tbody>

</table>

</div>

</div>

<!-- MATERIAL -->

<div class="box">

<h3>Uniform Material Master</h3>

<input
type="text"
id="matName"
placeholder="Enter Material">

<button
class="add-btn"
onclick="addMaterial()">

Add Material

</button>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Material</th>

<th>Action</th>

</tr>

</thead>

<tbody id="matTable"></tbody>

</table>

</div>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx_k3-Eb1N5e6P8fu1NgQgaCqwRkVhkiAWjkrLkJiSZtOoq724Sb6VkB4UCHJabXI2ndw/exec";

let editType = "";

let editRow = "";

/* ================= BRANCH ================= */

async function addBranch(){

    if(branchName.value=="") return;

    let obj = {

        sheet:"Branch_Master",

        branch:branchName.value
    };

    if(editType=="Branch_Master"){

        obj.action = "update";

        obj.row = editRow;
    }

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify(obj)
    });

    branchName.value="";

    editType="";

    loadBranch();
}

async function loadBranch(){

    let res =
    await fetch(
    API_URL + "?sheet=Branch_Master"
    );

    let data =
    await res.json();

    branchTable.innerHTML="";

    data.slice(1).forEach((b,i)=>{

        branchTable.innerHTML += `

        <tr>

            <td>${b[0]}</td>

            <td>

                <button
                class="update-btn"
                onclick="editBranch(${i+2},'${b[0]}')">

                Update

                </button>

                <button
                class="delete-btn"
                onclick="deleteData('Branch_Master',${i+2})">

                Delete

                </button>

            </td>

        </tr>
        `;
    });
}

/* ================= DEPARTMENT ================= */

async function addDept(){

    if(deptName.value=="") return;

    let obj = {

        sheet:"Department_Master",

        department:deptName.value
    };

    if(editType=="Department_Master"){

        obj.action = "update";

        obj.row = editRow;
    }

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify(obj)
    });

    deptName.value="";

    editType="";

    loadDept();
}

async function loadDept(){

    let res =
    await fetch(
    API_URL + "?sheet=Department_Master"
    );

    let data =
    await res.json();

    deptTable.innerHTML="";

    data.slice(1).forEach((d,i)=>{

        deptTable.innerHTML += `

        <tr>

            <td>${d[0]}</td>

            <td>

                <button
                class="update-btn"
                onclick="editDept(${i+2},'${d[0]}')">

                Update

                </button>

                <button
                class="delete-btn"
                onclick="deleteData('Department_Master',${i+2})">

                Delete

                </button>

            </td>

        </tr>
        `;
    });
}

/* ================= MATERIAL ================= */

async function addMaterial(){

    if(matName.value=="") return;

    let obj = {

        sheet:"Material_Master",

        material:matName.value
    };

    if(editType=="Material_Master"){

        obj.action = "update";

        obj.row = editRow;
    }

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify(obj)
    });

    matName.value="";

    editType="";

    loadMaterial();
}

async function loadMaterial(){

    let res =
    await fetch(
    API_URL + "?sheet=Material_Master"
    );

    let data =
    await res.json();

    matTable.innerHTML="";

    data.slice(1).forEach((m,i)=>{

        matTable.innerHTML += `

        <tr>

            <td>${m[0]}</td>

            <td>

                <button
                class="update-btn"
                onclick="editMaterial(${i+2},'${m[0]}')">

                Update

                </button>

                <button
                class="delete-btn"
                onclick="deleteData('Material_Master',${i+2})">

                Delete

                </button>

            </td>

        </tr>
        `;
    });
}

/* ================= EDIT ================= */

function editBranch(row,name){

    branchName.value = name;

    editType = "Branch_Master";

    editRow = row;
}

function editDept(row,name){

    deptName.value = name;

    editType = "Department_Master";

    editRow = row;
}

function editMaterial(row,name){

    matName.value = name;

    editType = "Material_Master";

    editRow = row;
}

/* ================= DELETE ================= */

async function deleteData(sheet,row){

    if(confirm("Delete Data?")){

        await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify({

                sheet:sheet,

                action:"delete",

                row:row
            })
        });

        loadBranch();

        loadDept();

        loadMaterial();
    }
}

/* ================= INIT ================= */

loadBranch();

loadDept();

loadMaterial();

</script>

</body>
</html>
